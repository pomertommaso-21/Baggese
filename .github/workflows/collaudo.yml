# Collaudo prima della pubblicazione.
# Le modifiche si caricano sul ramo "prova": qui l'app viene provata in un browser vero
# (ogni girone, ogni scheda, iPhone piccolo e grande, chiaro e scuro, computer).
# Solo se il collaudo è superato la versione passa al ramo "main", cioè va online.
# I tre controlli partono insieme, dentro l'ambiente ufficiale di Playwright che ha già i browser
# e tutti i pacchetti di sistema: così non c'è niente da installare e niente che resti appeso.
name: Collaudo e pubblicazione
on:
  push:
    branches: [prova]
permissions:
  contents: write
concurrency:
  group: collaudo
  cancel-in-progress: false
jobs:
  collaudo:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-noble
    strategy:
      fail-fast: true
      matrix:
        include:
          - nome: Collaudo dei gironi
            prova: node collaudo.js
          - nome: Collaudo con Safari
            prova: node collaudo_safari.js
          - nome: Prove dell'app
            prova: CI=1 node test/prove.js
    steps:
      - uses: actions/checkout@v4
      - name: Prepara le prove
        run: npm i --no-save playwright@1.49.1 typescript@6.0.3 >/dev/null
      - name: ${{ matrix.nome }}
        env:
          HOME: /root
        run: |
          node test/server.js 8765 &
          for i in $(seq 1 40); do node -e "require('http').get('http://localhost:8765/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" && break; sleep 0.5; done
          ${{ matrix.prova }}
  pubblica:
    name: Pubblica (solo se il collaudo è superato)
    needs: collaudo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push origin HEAD:main
