# Collaudo prima della pubblicazione.
# Le modifiche si caricano sul ramo "prova": qui l'app viene provata in un browser vero
# (ogni girone, ogni scheda, iPhone piccolo e grande, chiaro e scuro, computer).
# Solo se il collaudo è superato la versione passa al ramo "main", cioè va online.
name: Collaudo e pubblicazione
on:
  push:
    branches: [prova]
permissions:
  contents: write
concurrency:
  group: collaudo
  cancel-in-progress: false
jobs:
  collaudo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepara il browser di prova
        run: |
          npm i --no-save playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Collaudo dell'app
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node collaudo.js
      - name: Pubblica (solo se il collaudo è superato)
        run: git push origin HEAD:main
