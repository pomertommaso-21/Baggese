# Collaudo prima della pubblicazione.
# Le modifiche si caricano sul ramo "prova": qui l'app viene provata in un browser vero
# (ogni girone, ogni scheda, iPhone piccolo e grande, chiaro e scuro, computer).
# Solo se il collaudo è superato la versione passa al ramo "main", cioè va online.
name: Collaudo e pubblicazione
on:
  push:
    branches: [prova]
permissions:
  contents: write
concurrency:
  group: collaudo
  cancel-in-progress: false
jobs:
  collaudo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepara il browser di prova
        run: |
          npm i --no-save playwright@1.49.1 typescript@6.0.3 >/dev/null
          # l'installazione resta appesa se il sistema sta già aggiornando i pacchetti per conto suo: si ferma quell'aggiornamento e si aspetta che finisca
          sudo systemctl stop unattended-upgrades apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          for i in $(seq 1 60); do sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock >/dev/null 2>&1 || break; echo "aspetto che finisca un altro aggiornamento dei pacchetti..."; sleep 5; done
          timeout -k 10 480 npx playwright install --with-deps chromium webkit >/dev/null
      - name: Collaudo dell'app
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node collaudo.js
          node collaudo_safari.js
          CI=1 node test/prove.js
      - name: Pubblica (solo se il collaudo è superato)
        run: git push origin HEAD:main
