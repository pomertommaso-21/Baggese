name: Sonda Tuttocampo
on:
  push:
    paths: ['tools/sonda.mjs', '.github/workflows/sonda.yml']
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/sonda.mjs
