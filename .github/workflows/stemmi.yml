name: Scarica stemmi
on:
  push:
    paths: ['.github/workflows/stemmi.yml']
permissions:
  contents: write
jobs:
  stemmi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica e ridimensiona
        run: |
          pip install pillow >/dev/null
          python3 - <<'PY'
          import urllib.request, io
          from PIL import Image
          T={"tc_alzaiamilano": 1324029, "tc_cavallinobianc": 1078543, "tc_corvettofc": 1324030, "tc_enotria1908": 16940, "tc_futuracalciope": 1324031, "tc_labomba": 1324032, "tc_liscatecalcio": 1136057, "tc_nuovabolgiano": 1282897, "tc_pioltellese196": 1010805, "tc_polisportivaom": 1079212, "tc_realcrescenzag": 1282119, "tc_unionmulazzano": 1000460, "tc_unionotg": 1324033, "tc_vllaznialelite": 1282899, "tc_yousport": 1178393}
          for k,i in T.items():
              req=urllib.request.Request("https://b2-content.tuttocampo.it/Teams/200/%d.png"%i, headers={"User-Agent":"Mozilla/5.0"})
              im=Image.open(io.BytesIO(urllib.request.urlopen(req,timeout=30).read())).convert("RGBA")
              bb=im.getbbox(); im=im.crop(bb) if bb else im
              s=88/max(im.size); im=im.resize((max(1,round(im.width*s)),max(1,round(im.height*s))),Image.LANCZOS)
              out=Image.new("RGBA",(96,96),(0,0,0,0)); out.paste(im,((96-im.width)//2,(96-im.height)//2),im)
              out.save(k+".png",optimize=True); print(k, out.size)
          PY
      - name: Salva
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tc_*.png
          git rm -q .github/workflows/stemmi.yml
          git commit -m "Stemmi del Girone C di Terza Categoria"
          git push
