name: Scarica stemmi
on:
  push:
    paths: ['.github/workflows/stemmi.yml']
permissions:
  contents: write
jobs:
  stemmi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica e ridimensiona
        run: |
          pip install pillow >/dev/null
          python3 - <<'PY'
          import urllib.request, io
          from PIL import Image
          T={"pb_schiaffino":1163824,"pb_briantea":1001099,"pb_cassina":1000652,"pb_cantu":918791,"pb_zeta":1238264,"pb_giussano":1022364,"pb_itala":23660,"pb_dominante":62198,"pb_leoteam":917241,"pb_lomazzo":1323683,"pb_luisago":935546,"pb_montesolaro":71196,"pb_cadorago":1238092,"pb_lissone":40240,"pb_triuggese":675808,"pb_cermenate":1000659}
          for k,i in T.items():
              req=urllib.request.Request("https://b2-content.tuttocampo.it/Teams/200/%d.png"%i, headers={"User-Agent":"Mozilla/5.0"})
              im=Image.open(io.BytesIO(urllib.request.urlopen(req,timeout=30).read())).convert("RGBA")
              bb=im.getbbox(); im=im.crop(bb) if bb else im
              s=88/max(im.size); im=im.resize((max(1,round(im.width*s)),max(1,round(im.height*s))),Image.LANCZOS)
              out=Image.new("RGBA",(96,96),(0,0,0,0)); out.paste(im,((96-im.width)//2,(96-im.height)//2),im)
              out.save(k+".png",optimize=True); print(k, out.size)
          PY
      - name: Salva
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pb_*.png
          git rm -q .github/workflows/stemmi.yml
          git commit -m "Stemmi del Girone B"
          git push
