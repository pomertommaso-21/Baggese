name: Scarica stemmi
on:
  push:
    paths: ['.github/workflows/stemmi.yml']
permissions:
  contents: write
jobs:
  stemmi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica e ridimensiona
        run: |
          pip install pillow >/dev/null
          python3 - <<'PY'
          import urllib.request, io
          from PIL import Image
          T={"sp_agape": 1238268, "sp_cassinanuova": 675015, "sp_circologiovani": 1282802, "sp_cittadicinisel": 1200100, "sp_cologno": 1057130, "sp_cusunimib": 1079213, "sp_fcatleticobico": 1198939, "sp_jcusano1913": 1020325, "sp_niguardacalcio": 918787, "sp_pero": 1079208, "sp_pioxisperanza": 920929, "sp_pronovate": 933823, "sp_rondinella": 73055, "sp_sangiorgio1980": 917817, "sp_solese": 79929, "sp_vigorfc": 1237935}
          for k,i in T.items():
              req=urllib.request.Request("https://b2-content.tuttocampo.it/Teams/200/%d.png"%i, headers={"User-Agent":"Mozilla/5.0"})
              im=Image.open(io.BytesIO(urllib.request.urlopen(req,timeout=30).read())).convert("RGBA")
              bb=im.getbbox(); im=im.crop(bb) if bb else im
              s=88/max(im.size); im=im.resize((max(1,round(im.width*s)),max(1,round(im.height*s))),Image.LANCZOS)
              out=Image.new("RGBA",(96,96),(0,0,0,0)); out.paste(im,((96-im.width)//2,(96-im.height)//2),im)
              out.save(k+".png",optimize=True); print(k, out.size)
          PY
      - name: Salva
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add sp_*.png
          git rm -q .github/workflows/stemmi.yml
          git commit -m "Stemmi del Girone P di Seconda Categoria"
          git push
