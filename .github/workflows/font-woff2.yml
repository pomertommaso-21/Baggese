name: Font in formato WOFF2
on:
  push:
    paths: ['.github/workflows/font-woff2.yml']
permissions:
  contents: write
jobs:
  font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Converte i font (stesso disegno, file piu' piccoli)
        run: |
          pip install fonttools brotli >/dev/null
          python3 - <<'PY'
          import glob, os
          from fontTools.ttLib import TTFont
          for f in sorted(glob.glob("*.woff")):
              t = TTFont(f); t.flavor = "woff2"; out = f[:-5] + ".woff2"; t.save(out)
              print(f, os.path.getsize(f), "->", out, os.path.getsize(out))
          PY
      - name: Salva
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add *.woff2
          git rm -q .github/workflows/font-woff2.yml
          git commit -m "Font in formato WOFF2"
          git push origin HEAD:main HEAD:prova
