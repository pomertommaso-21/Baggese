name: Debug WebKit
on:
  push:
    branches: [debugwk]
jobs:
  dbg:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm i --no-save playwright@1.49.1 >/dev/null
          npx playwright install --with-deps webkit >/dev/null
      - run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node dbg_wk.js
