<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baggese">
<meta name="theme-color" content="#0F1B2E">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Baggese 2026/27</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app a colonna unica su telefono (barra in basso), con barra laterale da 232px sopra i 960px; notte da stadio + luce dei riflettori, stemmi in cornice tonda uniforme */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F4F6FA; --line:#DDE3EC; --card-border:transparent;
  --fg:#0D1524; --muted:#566174;
  --night:#0F1B2E; --night-2:#1B2B48; --on-night:#F4F7FC; --on-night-muted:#AFBCD1; --night-line:rgba(255,255,255,.07);
  --flood:#FFC93C; --on-flood:#231A00; --mine:#FFF3CC; --mine-ink:#6E5200;
  --win:#16934F; --draw:#717E92; --loss:#D63F2D; --yellow:#F2B705; --red:#D93025;
  --ring:rgba(13,21,36,.10); --active:#0F1B2E; --on-active:#F4F7FC;
  --shadow:0 1px 2px rgba(13,21,36,.05),0 10px 28px -16px rgba(13,21,36,.22);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070D17; --surface:#0F1827; --surface-2:#15213A; --line:#22324D; --card-border:#1A2740;
  --fg:#E9EEF6; --muted:#97A5BC;
  --night:#12233F; --night-2:#1C3157; --on-night:#F4F7FC; --on-night-muted:#AFBCD1; --night-line:rgba(255,255,255,.08);
  --flood:#FFC93C; --on-flood:#231A00; --mine:#2B2612; --mine-ink:#FFD866;
  --win:#2DB56B; --draw:#8592A6; --loss:#F2604C; --yellow:#F2B705; --red:#E5483D;
  --ring:rgba(255,255,255,.16); --active:#2B4A7E; --on-active:#FFFFFF;
  --shadow:0 12px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070D17; --surface:#0F1827; --surface-2:#15213A; --line:#22324D; --card-border:#1A2740;
  --fg:#E9EEF6; --muted:#97A5BC;
  --night:#12233F; --night-2:#1C3157; --on-night:#F4F7FC; --on-night-muted:#AFBCD1; --night-line:rgba(255,255,255,.08);
  --flood:#FFC93C; --on-flood:#231A00; --mine:#2B2612; --mine-ink:#FFD866;
  --win:#2DB56B; --draw:#8592A6; --loss:#F2604C; --yellow:#F2B705; --red:#E5483D;
  --ring:rgba(255,255,255,.16); --active:#2B4A7E; --on-active:#FFFFFF;
  --shadow:0 12px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(112px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;font-family:var(--display);text-transform:uppercase;line-height:.95;text-wrap:balance}
h1{font-size:clamp(30px,7vw,42px);font-weight:800;letter-spacing:.005em}
h2{font-size:19px;font-weight:700;letter-spacing:.03em}
.num{font-variant-numeric:tabular-nums}
.muted,.meta{color:var(--muted)} .meta{font-size:13px}
.small{font-size:13px} .tiny{font-size:12px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* stemmi: stessa cornice per tutti */
.crest{width:var(--s);height:var(--s);flex:none;border-radius:50%;background:#FFFFFF;box-shadow:0 0 0 1px var(--ring),0 2px 6px -2px rgba(13,21,36,.25);display:inline-flex;align-items:center;justify-content:center;overflow:hidden}
.crest svg{width:70%;height:80%;display:block}
.crest img{width:78%;height:78%;object-fit:contain;display:block}
.crest.lit{box-shadow:0 0 0 3px var(--flood),0 2px 10px -2px rgba(0,0,0,.4)}

/* superfici */
.card{background:var(--surface);border:1px solid var(--card-border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flush{padding:6px 10px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.night{background:var(--night);color:var(--on-night);border-radius:24px;padding:20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.night .muted,.night .meta{color:var(--on-night-muted)}
.pitch::before{content:"";position:absolute;left:50%;top:50%;width:300px;height:300px;transform:translate(-50%,-50%);border:2px solid var(--night-line);border-radius:50%;pointer-events:none}
.pitch::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-1px);background:var(--night-line);pointer-events:none}
.night>*{position:relative;z-index:1}

/* testata */
.top{display:flex;align-items:center;gap:14px}
.pos-chip{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;padding:8px 10px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--card-border)}
.pos-chip b{font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.pos-chip span{font-size:12px;color:var(--muted);font-weight:600}

/* home */
.home-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.hero-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero-top .eyebrow{color:var(--flood)}
.hero-date{font-size:14px;font-weight:600;color:var(--on-night-muted)}
.match-up{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;margin:22px 0 18px}
.side{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-width:0}
.side strong{font-size:16px;line-height:1.2;font-weight:700;overflow-wrap:anywhere}
.side span{font-size:12.5px;color:var(--on-night-muted);font-weight:500}
.mid{display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 4px}
.vs{font-family:var(--display);font-size:30px;font-weight:800;color:var(--on-night-muted);letter-spacing:.04em}
.countdown{background:var(--flood);color:var(--on-flood);font-weight:700;font-size:12px;border-radius:999px;padding:4px 10px;white-space:nowrap}
.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px;border-top:1px solid var(--night-line);flex-wrap:wrap}
.hero-foot span{font-size:13px;color:var(--on-night-muted);font-weight:600}
.scoreline{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;background:none;border:0;padding:0;color:inherit;text-align:left;width:100%}
.scoreline .t{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-weight:600;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.big-score{font-family:var(--display);font-weight:800;font-size:52px;line-height:.9;font-variant-numeric:tabular-nums;white-space:nowrap}
.big-score i{font-style:normal;color:var(--muted);padding:0 4px}
.form-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.form-item{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-2);border:0;border-radius:14px;padding:10px 4px;color:inherit}
.res-dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;font-weight:800;font-size:12px;color:#fff;flex:none}
.res-pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;letter-spacing:.08em;color:#fff;text-transform:uppercase}
.r-V{background:var(--win)} .r-N{background:var(--draw)} .r-P{background:var(--loss)}
.mini-row{display:grid;grid-template-columns:24px auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 8px;border-radius:12px;font-size:14px}
.mini-row.me{background:var(--mine);font-weight:700}
.mini-row b{font-family:var(--display);font-size:20px;font-weight:800}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--flood);border-radius:3px}
.scorer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.scorer b{font-family:var(--display);font-size:22px;font-weight:800;grid-row:span 2}

/* partite */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.rchip{flex:none;min-width:44px;height:44px;border-radius:12px;border:1px solid var(--card-border);background:var(--surface);box-shadow:var(--shadow);font-family:var(--display);font-weight:800;font-size:19px;color:var(--fg)}
.rchip.future{color:var(--muted)}
.rchip[aria-pressed="true"]{background:var(--active);color:var(--on-active);box-shadow:inset 0 -3px 0 var(--flood)}
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;width:100%;padding:12px 6px;background:none;border:0;border-top:1px solid var(--line);color:inherit;text-align:left}
.list>.board:first-child,.list>.fx:first-child,.list>.pl:first-child{border-top:0}
.board.is-me{background:var(--mine);border-radius:12px;border-top-color:transparent}
.board.is-me+.board{border-top-color:transparent}
.b-team{display:flex;align-items:center;gap:10px;justify-content:flex-end;min-width:0;font-weight:600;font-size:14px}
.b-team.away{justify-content:flex-start}
.b-team .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b-score{min-width:68px;text-align:center;font-family:var(--display);font-weight:800;font-size:24px;background:var(--surface-2);border-radius:10px;padding:5px 8px;line-height:1;font-variant-numeric:tabular-nums}
.b-score i{font-style:normal;color:var(--muted);padding:0 3px}
.b-score small{font-family:var(--body);font-size:11.5px;font-weight:600;color:var(--muted);display:block;line-height:1.25}
.fx{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:12px 4px;background:none;border:0;border-top:1px solid var(--line);color:inherit;text-align:left}
.fx-round{font-family:var(--display);font-weight:800;font-size:20px;color:var(--muted);text-align:center}
.fx-main{display:flex;align-items:center;gap:12px;min-width:0}
.fx-main b{font-weight:700;font-size:15px}
.fx-score{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:22px}
.split{display:flex;align-items:center;gap:10px;margin:6px 4px 2px}
.split::after{content:"";flex:1;height:1px;background:var(--line)}

/* classifica */
.tbl{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:14px}
th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 6px;text-align:center;white-space:nowrap}
td{padding:9px 6px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
td.name,th.name{text-align:left}
td.name{min-width:150px}
tr.me td{background:var(--mine);border-top-color:transparent}
tr.me td:first-child{border-radius:12px 0 0 12px} tr.me td:last-child{border-radius:0 12px 12px 0}
tr.me+tr td{border-top-color:transparent}
.pts{font-family:var(--display);font-weight:800;font-size:20px}
.tcell{display:flex;align-items:center;gap:10px;font-weight:600}
.posn{font-family:var(--display);font-weight:800;font-size:18px;color:var(--muted)}
tr.me .posn{color:var(--mine-ink)}
.fdots{display:inline-flex;gap:3px}
.fdots span{width:18px;height:18px;border-radius:5px;font-size:10px;font-weight:800;color:#fff;display:inline-flex;align-items:center;justify-content:center}

/* squadre */
.crest-strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.crest-strip::-webkit-scrollbar{display:none}
.cpick{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;background:none;border:0;padding:4px 0;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em}
.cpick[aria-pressed="true"]{color:var(--fg)}
.team-hero{display:flex;flex-direction:column;gap:18px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--night-2);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.stat b{font-family:var(--display);font-size:clamp(19px,5.4vw,26px);white-space:nowrap;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--on-night-muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pl{display:grid;grid-template-columns:34px minmax(0,1fr) 40px 40px 52px;align-items:center;gap:8px;padding:10px 2px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;text-align:left;font-size:14px}
.pl-head{border-top:0;padding-top:0;padding-bottom:4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pl-head span,.pl>span:nth-child(n+3){text-align:center}
.num-badge{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:16px}
.pl b{font-weight:700}
.goal{font-family:var(--display);font-weight:800;font-size:19px}
.card-y,.card-r{display:inline-block;width:9px;height:13px;border-radius:2px;vertical-align:-1px}
.card-y{background:var(--yellow)} .card-r{background:var(--red)}
.cards{display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:13px}

/* controlli */
button,.btn{font:inherit;cursor:pointer}
.btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:700;font-size:14px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary,.btn.flood{background:var(--flood);color:var(--on-flood);border-color:transparent}
.btn.dark{background:var(--night);color:var(--on-night);border-color:transparent}
.btn.danger{color:var(--loss)}
.btn.ghost{border-style:dashed;background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;color:var(--fg);font-weight:700;font-size:13px;min-height:36px;padding:0 4px;text-decoration:underline;text-decoration-color:var(--flood);text-decoration-thickness:2px;text-underline-offset:4px}
:focus-visible{outline:3px solid var(--flood);outline-offset:2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--shadow);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:700;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--active);color:var(--on-active)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 12px;width:100%;min-width:0}
input[type="color"]{padding:4px;width:44px;flex:none;cursor:pointer}
textarea{padding:10px 12px;min-height:150px;resize:vertical;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.list{display:flex;flex-direction:column}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.note{font-size:13px;background:var(--mine);color:var(--fg);border-radius:12px;padding:10px 12px}
.pill{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--fg)}
.pill.new{background:var(--flood);color:var(--on-flood)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--win)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 7px;border-radius:8px;font-size:12px;font-weight:800;color:#fff}
.b-V{background:var(--win)} .b-N{background:var(--draw)} .b-P{background:var(--loss)}
.dot{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted)}
.score{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.team-edit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.team-edit:first-child{border-top:0}
.team-edit .ctrls{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.team-edit .ctrls select{width:auto;flex:1 1 150px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* navigazione */
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
nav.tabs .brand{display:none}
nav.tabs .in{max-width:720px;margin:0 auto;display:flex;justify-content:space-around}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;min-height:48px;color:var(--muted);font-size:11px;font-weight:600}
nav.tabs button span{display:flex;padding:5px 16px;border-radius:999px}
nav.tabs button[aria-current="page"]{color:var(--fg);font-weight:800}
nav.tabs button[aria-current="page"] span{background:var(--flood);color:var(--on-flood)}

dialog{border:0;border-radius:22px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--surface);color:var(--fg);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(5,10,20,.6)}
dialog .dlg{padding:20px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--night);color:var(--on-night);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:20;max-width:calc(100vw - 32px);box-shadow:0 0 0 2px var(--flood)}

@media (min-width:720px){
  .home-grid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
  .span2{grid-column:1/-1}
}
@media (min-width:960px){
  body{padding-left:232px}
  .wrap{padding-block:32px 48px}
  nav.tabs{top:0;bottom:0;right:auto;width:232px;border-top:0;border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:24px}

<body>
<main class="wrap" id="app" aria-live="polite">
  <div class="empty"><h1>Baggese</h1><p class="muted">Caricamento dei dati della stagione…</p></div>
</main>
<nav class="tabs" aria-label="Sezioni"><div class="brand" id="brand"></div><div class="in" id="tabs"></div></nav>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
var DOC_PATH = "stagioni/s2026-27";
var LS_KEY = "baggese-2026-27";
var S = blank();
var db = null, docRef = null, downloads = null, mode = "loading";
var tab = "home", filterMine = true, tableSrc = null, rosaTeam = null, clsView = "squadre", parsed = null, saveTimer = null, pendingWrite = false;

function blank(){ return {settings:{season:"2026/27", girone:"Seconda Categoria Milano", myTeamId:null, tcLink:""}, teams:[], matches:[], players:[], imported:null, updatedAt:null}; }
function uid(p){ return (p||"x") + Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
function $(id){ return document.getElementById(id); }
function team(id){ for (var i=0;i<S.teams.length;i++) if (S.teams[i].id===id) return S.teams[i]; return null; }
function tname(id){ var t=team(id); return t? t.name : "?"; }
function initials(name){ var w=String(name||"?").replace(/[^A-Za-zÀ-ÿ0-9 ]/g," ").trim().split(/\s+/).filter(function(x){return x.length>1 && !/^(asd|ssd|us|usd|ac|fc|ss|pol|calcio)$/i.test(x);}); if(!w.length) w=[name||"?"]; return (w.length>1? w[0][0]+w[1][0] : w[0].slice(0,2)).toUpperCase(); }
function me(){ return S.settings.myTeamId; }
function played(m){ return m.hg!=null && m.ag!=null && m.hg!=="" && m.ag!==""; }
function involves(m,id){ return m.homeId===id || m.awayId===id; }
function fmtDate(d,t){ if(!d) return t||""; var p=d.split("-"); if(p.length!==3) return d; var dt=new Date(+p[0],+p[1]-1,+p[2]); var gg=["Dom","Lun","Mar","Mer","Gio","Ven","Sab"][dt.getDay()]; var mm=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"][+p[1]-1]; return gg+" "+(+p[2])+" "+mm+(t? " · "+t : ""); }
function sortMatches(a,b){ var ra=a.round||999, rb=b.round||999; if(ra!==rb) return ra-rb; return String(a.date||"9").localeCompare(String(b.date||"9")); }
function resultFor(m,id){ if(!played(m)) return null; var g1=+(m.homeId===id? m.hg:m.ag), g2=+(m.homeId===id? m.ag:m.hg); return g1>g2?"V":g1<g2?"P":"N"; }
function toast(msg){ var t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){t.hidden=true;},2400); }

/* ---------- storage ---------- */
function save(){
  S.updatedAt = new Date().toISOString();
  pendingWrite = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    var copy = JSON.parse(JSON.stringify(S));
    if (docRef){
      docRef.set(copy).then(function(){ pendingWrite=false; }).catch(function(e){
        pendingWrite=false;
        toast(e && e.code==="invalid_argument" ? "Non hai i permessi per modificare questi dati." : "Salvataggio non riuscito, riprova tra poco.");
      });
    } else {
      try { localStorage.setItem(LS_KEY, JSON.stringify(copy)); } catch(e){}
      pendingWrite=false;
    }
  }, 350);
  render();
}
function normalize(d){
  var b=blank(); d=d||{};
  b.settings=Object.assign(b.settings, d.settings||{});
  b.teams=Array.isArray(d.teams)?d.teams:[]; b.matches=Array.isArray(d.matches)?d.matches:[];
  b.players=Array.isArray(d.players)?d.players:[]; b.imported=d.imported||null; b.updatedAt=d.updatedAt||null;
  return b;
}
function boot(){
  var useP = (window.claude && window.claude.use) ? window.claude.use("db") : Promise.resolve(null);
  useP.then(function(ns){
    db=ns;
    if (!db){ fallbackLocal(); return; }
    docRef=db.doc(DOC_PATH); mode="db";
    db.collection("loghi").onSnapshot(function(q){ LOGOS={}; q.docs.forEach(function(x){ var v=x.data(); if(v&&typeof v.src==="string"&&/^data:image\/(png|jpeg|webp|gif);base64,/.test(v.src)) LOGOS[x.id]=v.src; }); render(); }, function(){});
    docRef.onSnapshot(function(snap){
      if (pendingWrite && snap.metadata && !snap.metadata.hasPendingWrites) return;
      S = normalize(snap.exists ? snap.data() : null);
      ensureMyTeam(); render();
    }, function(){ fallbackLocal(); toast("Archivio non raggiungibile: dati salvati solo su questo dispositivo."); });
  }).catch(fallbackLocal);
  if (window.claude && window.claude.use) window.claude.use("downloads").then(function(d){ downloads=d; if(tab==="gestione") render(); }).catch(function(){});
}
function fallbackLocal(){
  if (mode==="local") return;
  mode="local"; docRef=null;
  var raw=null; try { raw=localStorage.getItem(LS_KEY); } catch(e){}
  if (raw){ try { S=normalize(JSON.parse(raw)); } catch(e){ S=blank(); } ensureMyTeam(); loadLocalLogos(); render(); return; }
  loadSeed(false);
}
function loadSeed(manual){
  fetch("data.json",{cache:"no-store"}).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(d){
    S=normalize(d); ensureMyTeam(); loadLocalLogos();
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){}
    render(); if(manual) toast("Dati ricaricati da data.json");
  }).catch(function(){ if(!manual){ S=blank(); ensureMyTeam(); render(); } else toast("data.json non trovato accanto all\u2019app"); });
}
function ensureMyTeam(){
  if (!S.settings.myTeamId || !team(S.settings.myTeamId)){
    var t=findTeam("Baggese");
    if (!t){ t={id:uid("t"), name:"Baggese"}; S.teams.push(t); }
    S.settings.myTeamId=t.id;
  }
}

/* ---------- names ---------- */
var STOP=/^(a|s|d|asd|ssd|ssdarl|us|usd|u|ac|fc|ss|pol|polisportiva|calcio|sc|gs|cs|as|ad|arl|srl|c)$/;
function norm(n){ return String(n||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim().split(" ").filter(function(w){return w && !STOP.test(w);}).join(" "); }
function findTeam(name, extra){
  var n=norm(name); if(!n) return null;
  var pool=S.teams.concat(extra||[]), i;
  for (i=0;i<pool.length;i++) if (norm(pool[i].name)===n) return pool[i];
  for (i=0;i<pool.length;i++){ var o=norm(pool[i].name); if (o.length>=4 && n.length>=4 && (o.indexOf(n)>=0 || n.indexOf(o)>=0)) return pool[i]; }
  return null;
}

/* ---------- standings ---------- */
function standings(){
  var rows={}, ms=S.matches.filter(played);
  S.teams.forEach(function(t){ rows[t.id]={id:t.id,g:0,v:0,n:0,p:0,gf:0,gs:0,pts:0,form:[]}; });
  ms.slice().sort(sortMatches).forEach(function(m){
    var h=rows[m.homeId], a=rows[m.awayId]; if(!h||!a) return;
    var hg=+m.hg, ag=+m.ag;
    h.g++; a.g++; h.gf+=hg; h.gs+=ag; a.gf+=ag; a.gs+=hg;
    if (hg>ag){ h.v++; a.p++; h.pts+=3; h.form.push("V"); a.form.push("P"); }
    else if (hg<ag){ a.v++; h.p++; a.pts+=3; a.form.push("V"); h.form.push("P"); }
    else { h.n++; a.n++; h.pts++; a.pts++; h.form.push("N"); a.form.push("N"); }
  });
  var list=Object.keys(rows).map(function(k){return rows[k];});
  list.sort(function(x,y){ return y.pts-x.pts || (y.gf-y.gs)-(x.gf-x.gs) || y.gf-x.gf || tname(x.id).localeCompare(tname(y.id)); });
  list.forEach(function(r,i){ r.pos=i+1; });
  return list;
}
function importedRows(){ if(!S.imported||!S.imported.rows) return []; return S.imported.rows.filter(function(r){return team(r.teamId);}).map(function(r){ return {id:r.teamId,pos:r.pos,g:r.g,v:r.v,n:r.n,p:r.p,gf:r.gf,gs:r.gs,pts:r.pts}; }).sort(function(a,b){return a.pos-b.pos;}); }
function currentTable(){
  var calc=standings(), imp=importedRows();
  var gCalc=calc.reduce(function(s,r){return s+r.g;},0), gImp=imp.reduce(function(s,r){return s+(+r.g||0);},0);
  var src = tableSrc || (imp.length && gImp>gCalc ? "imp" : "calc");
  if (src==="imp" && !imp.length) src="calc";
  return {src:src, rows: src==="imp"? imp : calc, hasImp: imp.length>0, calcPlayed:gCalc};
}

/* ---------- player stats ---------- */
function playerStats(){
  var st={}, cut=(S.imported&&S.imported.round)||0;
  S.players.forEach(function(p){ var t=p.tc||{}; st[p.id]={gol:+t.gol||0,y:+t.y||0,r:+t.r||0,pres:+t.pres||0}; });
  S.matches.forEach(function(m){
    if(cut && m.round && +m.round<=cut) return;
    (m.scorers||[]).forEach(function(s){ if(st[s.playerId]) st[s.playerId].gol++; });
    (m.cards||[]).forEach(function(c){ if(st[c.playerId]) st[c.playerId][c.type==="r"?"r":"y"]++; });
  });
  return st;
}

/* ---------- icons ---------- */
var IC={
 home:'<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 table:'<path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/>',
 team:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.4 3.5 5.2"/>',
 edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>',
 paste:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6"/>'
};
function icon(k){ return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+IC[k]+'</svg>'; }

/* ---------- render ---------- */
var partView = "mine", selRound = null;

/* stemmi: stessa cornice tonda per tutti; logo caricato o scudetto generato con i colori sociali */
var KITS={t_baggese:["#1E4FC2","#FFFFFF","stripes"],t_ardor:["#C8102E","#FFFFFF","halves"],t_artemide:["#6B2FB3","#F2C230","sash"],t_bonola:["#0B8A4B","#FFFFFF","hoops"],t_cesano:["#E36414","#1F2A44","stripes"],t_concept:["#111827","#D1D5DB","quarters"],t_corsico:["#0F766E","#F5F5F4","sash"],t_novella:["#B91C1C","#FACC15","stripes"],t_trezzano:["#1D4ED8","#FACC15","hoops"],t_seguro:["#9F1239","#93C5FD","halves"],t_triestina:["#DC2626","#FFFFFF","solid"],t_velasca:["#2563EB","#F8FAFC","sash"],t_vercellese:["#F8FAFC","#DC2626","hoops"],t_vige:["#0369A1","#F59E0B","quarters"],t_villapizzone:["#15803D","#FDE047","halves"],t_viscontini:["#7C2D12","#FDBA74","stripes"]};
var SHORT={t_baggese:"BAG",t_ardor:"ARD",t_artemide:"ART",t_bonola:"BON",t_cesano:"CES",t_concept:"CON",t_corsico:"COR",t_novella:"NOV",t_trezzano:"TRE",t_seguro:"SEG",t_triestina:"TRI",t_velasca:"VEL",t_vercellese:"VER",t_vige:"VIG",t_villapizzone:"VIL",t_viscontini:"VIS"};
var PATS=[["stripes","Strisce verticali"],["hoops","Strisce orizzontali"],["halves","Metà e metà"],["sash","Banda diagonale"],["quarters","Quarti"],["solid","Tinta unita"]];
var LOGOS={}, crestN=0;
function hex(c,d){ return /^#[0-9a-f]{6}$/i.test(c||"")?c:d; }
function autoKit(id){ var pal=[["#1E4FC2","#FFFFFF"],["#C8102E","#FFFFFF"],["#0B8A4B","#FFFFFF"],["#111827","#E5E7EB"],["#E36414","#1F2A44"],["#6B2FB3","#F2C230"],["#0369A1","#F59E0B"]], h=0; String(id).split("").forEach(function(c){h=(h*31+c.charCodeAt(0))>>>0;}); var p=pal[h%pal.length]; return [p[0],p[1],PATS[h%PATS.length][0]]; }
function kit(id){ var t=team(id), k=(t&&t.kit)||{}, d=KITS[id]||autoKit(id); return {c1:hex(k.c1,d[0]), c2:hex(k.c2,d[1]), pat:(PATS.some(function(p){return p[0]===k.pat;})?k.pat:d[2])}; }
function shortName(id){ var t=team(id); if(t&&t.short) return String(t.short).slice(0,3).toUpperCase(); if(SHORT[id]) return SHORT[id]; var n=norm(t?t.name:"").replace(/ /g,""); return (n.slice(0,3)||"?").toUpperCase(); }
function crestSvg(id){
  var k=kit(id), c1=k.c1, c2=k.c2, n="cr"+(++crestN), body;
  var shield="M4 3H36V22C36 34 28.5 41 20 45.5C11.5 41 4 34 4 22Z";
  switch(k.pat){
    case "stripes": body='<rect width="40" height="48" fill="'+c1+'"/><rect x="8" width="6" height="48" fill="'+c2+'"/><rect x="20" width="6" height="48" fill="'+c2+'"/><rect x="32" width="6" height="48" fill="'+c2+'"/>'; break;
    case "hoops": body='<rect width="40" height="48" fill="'+c1+'"/><rect y="7" width="40" height="5" fill="'+c2+'"/><rect y="33" width="40" height="5" fill="'+c2+'"/><rect y="42" width="40" height="5" fill="'+c2+'"/>'; break;
    case "halves": body='<rect width="20" height="48" fill="'+c1+'"/><rect x="20" width="20" height="48" fill="'+c2+'"/>'; break;
    case "sash": body='<rect width="40" height="48" fill="'+c1+'"/><path d="M-6 8 L8 -6 L48 40 L34 54 Z" fill="'+c2+'"/>'; break;
    case "quarters": body='<rect width="40" height="48" fill="'+c1+'"/><rect x="20" width="20" height="23" fill="'+c2+'"/><rect y="23" width="20" height="25" fill="'+c2+'"/>'; break;
    default: body='<rect width="40" height="48" fill="'+c1+'"/><rect y="3" width="40" height="5" fill="'+c2+'"/>';
  }
  return '<svg viewBox="0 0 40 48" aria-hidden="true"><defs><clipPath id="'+n+'"><path d="'+shield+'"/></clipPath></defs><g clip-path="url(#'+n+')">'+body+'<rect y="17.5" width="40" height="11.5" fill="#0D1524" opacity=".92"/></g><path d="'+shield+'" fill="none" stroke="#0D1524" stroke-opacity=".35" stroke-width="1.2"/><text x="20" y="26.6" text-anchor="middle" font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="800" font-size="9.4" letter-spacing=".5" fill="#FFFFFF">'+esc(shortName(id))+'</text></svg>';
}
function crest(id,size,extra){ var src=LOGOS[id]; return '<span class="crest'+(extra?' '+extra:'')+'" style="--s:'+(size||32)+'px">'+(src?'<img src="'+esc(src)+'" alt="">':crestSvg(id))+'</span>'; }

/* helpers */
var TABS=[["home","Home","home"],["partite","Partite","cal"],["classifica","Classifica","table"],["rosa","Squadre","team"],["gestione","Gestione","edit"]];
function byName(a,b){ return a.name.localeCompare(b.name); }
function pTeam(p){ return p.teamId||me(); }
function curRosaTeam(){ return (rosaTeam && team(rosaTeam)) ? rosaTeam : me(); }
function tableRow(id){ var r=null; currentTable().rows.forEach(function(x){ if(x.id===id) r=x; }); return r; }
function formOf(id,n){ return S.matches.filter(function(m){return involves(m,id)&&played(m);}).sort(sortMatches).slice(-(n||5)); }
function daysTo(d){ if(!d) return null; var p=d.split("-"); if(p.length!==3) return null; var t=new Date(+p[0],+p[1]-1,+p[2]), n=new Date(); n.setHours(0,0,0,0); return Math.round((t-n)/864e5); }
function whenLabel(d){ var x=daysTo(d); if(x===null||x<0) return ""; if(x===0) return "Oggi"; if(x===1) return "Domani"; if(x<8) return "Tra "+x+" giorni"; return ""; }
function nextRound(){ var r=null; S.matches.forEach(function(m){ if(!played(m)&&m.round&&(r===null||+m.round<r)) r=+m.round; }); if(r===null) S.matches.forEach(function(m){ if(m.round&&(r===null||+m.round>r)) r=+m.round; }); return r||1; }
function rounds(){ var o={}; S.matches.forEach(function(m){ if(m.round) o[+m.round]=1; }); return Object.keys(o).map(Number).sort(function(a,b){return a-b;}); }
function resLabel(r){ return {V:"Vittoria",N:"Pareggio",P:"Sconfitta"}[r]; }
function syncChip(){ if(!S.updatedAt) return ""; var d=new Date(S.updatedAt); return '<span class="chip"><i></i>Dati aggiornati il '+d.toLocaleDateString("it-IT",{day:"numeric",month:"long"})+(mode==="local"?" · salvati su questo dispositivo":"")+'</span>'; }
function header(title,sub,right){ return '<div class="row between" style="align-items:flex-end;flex-wrap:wrap"><div class="col" style="gap:6px">'+(sub?'<span class="eyebrow muted">'+esc(sub)+'</span>':'')+'<h1>'+esc(title)+'</h1></div>'+(right||'')+'</div>'; }

function render(){
  if(mode==="loading"){ $("tabs").innerHTML=""; return; }
  crestN=0;
  $("tabs").innerHTML=TABS.map(function(t){ return '<button type="button" data-tab="'+t[0]+'"'+(tab===t[0]?' aria-current="page"':'')+'><span>'+icon(t[2])+'</span>'+t[1]+'</button>'; }).join("");
  $("brand").innerHTML=crest(me(),36)+'<b>'+esc(shortName(me()))+'<br><span class="tiny muted" style="font-family:var(--body);font-weight:600;text-transform:none">'+esc(S.settings.season)+'</span></b>';
  var v={home:vHome,partite:vPartite,classifica:vClassifica,rosa:vRosa,gestione:vGestione}[tab];
  $("app").innerHTML='<div class="view">'+v()+'</div>';
  var rc=document.querySelector('.rchip[aria-pressed="true"]'), strip=$("roundChips");
  if(rc&&strip) strip.scrollLeft=rc.offsetLeft-strip.clientWidth/2+rc.clientWidth/2;
}

/* ---------- home ---------- */
function vHome(){
  var my=me(), myName=tname(my), myRow=tableRow(my);
  var h='<header class="top">'+crest(my,56)+'<div class="col grow"><span class="eyebrow muted">'+esc(S.settings.girone)+'</span><h1>'+esc(myName)+'</h1></div>'+(myRow&&myRow.g?'<div class="pos-chip"><b>'+myRow.pos+'°</b><span>'+myRow.pts+' pt</span></div>':'')+'</header>';
  if (S.teams.length<2 && !S.matches.length){
    return h+'<div class="empty"><h2>Prepara il girone</h2><ol class="steps small"><li>Apri la classifica del girone su Tuttocampo o il comunicato del giovedì.</li><li>Seleziona tutto e copia.</li><li>Incolla in Gestione: squadre, risultati e classifica si creano da soli.</li></ol><button class="btn primary" type="button" data-go="import">'+icon("paste")+'Incolla i dati</button></div>';
  }
  var mine=S.matches.filter(function(m){return involves(m,my);}).sort(sortMatches);
  var next=mine.filter(function(m){return !played(m);})[0], last=mine.filter(played).slice(-1)[0];
  h+='<div class="home-grid">';
  if (next){
    var hr=tableRow(next.homeId), ar=tableRow(next.awayId), wl=whenLabel(next.date);
    function side(id,row){ return '<div class="side">'+crest(id,78,id===my?'lit':'')+'<strong>'+esc(tname(id))+'</strong><span>'+(row&&row.g?row.pos+'° · '+row.pts+' punti':'&nbsp;')+'</span></div>'; }
    h+='<section class="night pitch span2"><div class="hero-top"><span class="eyebrow">Prossima partita'+(next.round?' · '+next.round+'ª giornata':'')+'</span><span class="hero-date">'+esc(fmtDate(next.date,next.time)||"Data da definire")+'</span></div><div class="match-up">'+side(next.homeId,hr)+'<div class="mid">'+(wl?'<span class="countdown">'+wl+'</span>':'')+'<span class="vs">VS</span></div>'+side(next.awayId,ar)+'</div><div class="hero-foot"><span>'+(next.homeId===my?'Si gioca in casa':'Si gioca in trasferta')+'</span><button class="btn flood" type="button" data-edit="'+next.id+'">Inserisci risultato</button></div></section>';
  }
  var col1='', col2='';
  if (last){
    var r=resultFor(last,my);
    col1+='<section class="card"><div class="card-head"><h2>Ultimo risultato</h2><span class="res-pill r-'+r+'">'+resLabel(r)+'</span></div><button type="button" class="scoreline" data-edit="'+last.id+'"><span class="t">'+crest(last.homeId,48)+esc(tname(last.homeId))+'</span><span class="big-score">'+esc(last.hg)+'<i>–</i>'+esc(last.ag)+'</span><span class="t">'+crest(last.awayId,48)+esc(tname(last.awayId))+'</span></button><span class="meta" style="text-align:center">'+(last.round?last.round+'ª giornata · ':'')+esc(fmtDate(last.date))+'</span>'+scorerLine(last)+'</section>';

/* ---------- loghi ---------- */
function processLogo(file,tid){
  if(!file||!/^image\//.test(file.type)){ toast("Scegli un’immagine (PNG, JPG, SVG)"); return; }
  var fr=new FileReader();
  fr.onload=function(){ var img=new Image(); img.onload=function(){
    var c=document.createElement("canvas"); c.width=c.height=160; var x=c.getContext("2d");
    var w=img.naturalWidth||160, hh=img.naturalHeight||160, s=Math.min(144/w,144/hh), dw=w*s, dh=hh*s;
    x.drawImage(img,(160-dw)/2,(160-dh)/2,dw,dh);
    var url=c.toDataURL("image/png"); if(url.length>90000) url=c.toDataURL("image/jpeg",.86);
    setLogo(tid,url);
  }; img.onerror=function(){ toast("Non riesco a leggere questa immagine"); }; img.src=fr.result; };
  fr.readAsDataURL(file);
}
function setLogo(tid,url){
  if(url) LOGOS[tid]=url; else delete LOGOS[tid];
  if(db){ var ref=db.doc("loghi/"+tid); (url?ref.set({src:url}):ref.delete()).catch(function(){ toast("Logo non salvato, riprova"); }); }
  else saveLocalLogos();
  render(); toast(url?"Logo aggiornato":"Logo rimosso");
}
function saveLocalLogos(){ var o={}; Object.keys(LOGOS).forEach(function(k){ if(/^data:image\//.test(LOGOS[k])) o[k]=LOGOS[k]; }); try{ localStorage.setItem(LS_KEY+"-logos",JSON.stringify(o)); }catch(e){ toast("Memoria del browser piena: logo non salvato"); } }
function loadLocalLogos(){
  try{ var o=JSON.parse(localStorage.getItem(LS_KEY+"-logos")||"{}"); Object.keys(o).forEach(function(k){ if(/^data:image\//.test(o[k])) LOGOS[k]=o[k]; }); }catch(e){}
  if(window.claude) return;
  S.teams.forEach(function(t){ if(LOGOS[t.id]) return; var im=new Image(); im.onload=function(){ if(!LOGOS[t.id]){ LOGOS[t.id]="logos/"+t.id+".png"; render(); } }; im.src="logos/"+t.id+".png"; });
}

/* ---------- paste parser ---------- */
function tokenize(text){
  var toks=[], lines=String(text).replace(/\r/g,"").split("\n");
  lines.forEach(function(raw){
    var line=raw.replace(/ /g," ").trim(); if(!line) return;
    var m=line.match(/(\d{1,2})\s*[°ªº^a]?\s*giornata/i)||line.match(/giornata\s*(?:n\.?\s*)?(\d{1,2})\b/i);
    var gm=line.match(/^GIRONE\s+([A-Z]{1,2})\b/i);
    if(gm && line.length<60){ toks.push({t:"GIRONE",v:gm[1].toUpperCase()}); if(m) toks.push({t:"ROUND",v:+m[1]}); return; }
    if(line.length<70 && /CATEGORIA|COPPA|JUNIORES|ALLIEVI|GIOVANISSIMI|ESORDIENTI|PULCINI|FEMMINILE|CALCIO A 5|UNDER\s*\d+/i.test(line) && !/\d\s*[-–]\s*\d/.test(line)){ toks.push({t:"CAT",v:line.toUpperCase()}); return; }
    if(m && line.length<60){ toks.push({t:"ROUND",v:+m[1]}); return; }
    var dm=line.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);
    if(dm){
      var y=+dm[3]; if(y<100) y+=2000;
      toks.push({t:"DATE",v:y+"-"+("0"+dm[2]).slice(-2)+"-"+("0"+dm[1]).slice(-2)});
      line=line.replace(dm[0]," ");
      var tm=line.match(/\b([01]?\d|2[0-3])[:.]([0-5]\d)\b/);
      if(tm){ toks.push({t:"TIME",v:("0"+tm[1]).slice(-2)+":"+tm[2]}); line=line.replace(tm[0]," "); }
      line=line.replace(/\b(lun|mar|mer|gio|ven|sab|dom)[a-zì]*\.?\b/ig," ").replace(/\bore\b/ig," ").replace(/\s+/g," ").trim();
      if(!line || line.length<3) return;
    }
    var r1=line.match(/^(.*?(?:[A-Za-zÀ-ÿ.)']|\s\d{4}))\s+(\d{1,2})\s*[-–:]\s*(\d{1,2})\s+([A-Za-zÀ-ÿ].*)$/);
    if(r1){ toks.push({t:"RESULT",h:r1[1].trim(),a:r1[4].trim(),hg:+r1[2],ag:+r1[3]}); return; }
    var r2=line.match(/^([A-Za-zÀ-ÿ].*?)\s+[-–]\s+([A-Za-zÀ-ÿ].*?)\s+(\d{1,2})\s*[-–:]\s*(\d{1,2})$/);
    if(r2){ toks.push({t:"RESULT",h:r2[1].trim(),a:r2[2].trim(),hg:+r2[3],ag:+r2[4]}); return; }
    var r3=line.match(/^([A-Za-zÀ-ÿ][^\t]*?)\s+[-–]\s+([A-Za-zÀ-ÿ][^\t]*)$/);
    if(r3){ toks.push({t:"PAIR",h:r3[1].trim(),a:r3[2].trim()}); return; }
    line.split(/\t+|\s{3,}/).forEach(function(cell){
      var c=cell.trim(); if(!c) return;
      if(/^[-–]$/.test(c)){ toks.push({t:"DASH"}); return; }
      if(/^\d{1,2}\s*[-–:]\s*\d{1,2}$/.test(c)){ var sp=c.split(/\s*[-–:]\s*/); toks.push({t:"SCORE",hg:+sp[0],ag:+sp[1]}); return; }
      if(/^[-+]?\d+$/.test(c)){ toks.push({t:"NUM",v:+c}); return; }
      if(/^[-+]?\d+(\s+[-+]?\d+)+$/.test(c)){ c.split(/\s+/).forEach(function(n){toks.push({t:"NUM",v:+n});}); return; }
      var lead=c.match(/^(\d{1,2})[.)°]?\s+([A-Za-zÀ-ÿ].*)$/);
      if(lead){ toks.push({t:"NUM",v:+lead[1]}); c=lead[2]; }
      var tr=c.match(/^(.*?[A-Za-zÀ-ÿ.)'](?:\s+\d{4})?)((?:\s+[-+]?\d{1,3})+)$/);
      if(tr){ toks.push({t:"TEXT",v:tr[1].trim()}); tr[2].trim().split(/\s+/).forEach(function(n){toks.push({t:"NUM",v:+n});}); return; }
      toks.push({t:"TEXT",v:c});
    });
  });
  return toks;
}
function solveRow(a){
  for(var j=0;j+3<a.length;j++){
    var g=a[j],v=a[j+1],n=a[j+2],p=a[j+3];
    if(g<0||v<0||n<0||p<0||g>40||v+n+p!==g) continue;
    var target=3*v+n;
    for(var k=0;k<a.length;k++){
      if(k>=j&&k<=j+3) continue;
      if(a[k]===target || (a[k]<target && a[k]>=target-6 && k<j)){
        var rest=a.filter(function(_,i){return i!==k&&(i<j||i>j+3);});
        var gf=rest.length>=2?rest[0]:0, gs=rest.length>=2?rest[1]:0;
        if (k>j+3){ var after=a.slice(j+4).filter(function(_,i){return (j+4+i)!==k;}); if(after.length>=2){gf=after[0];gs=after[1];} }
        else { var aft=a.slice(j+4); if(aft.length>=2){gf=aft[0];gs=aft[1];} }
        return {pts:a[k],g:g,v:v,n:n,p:p,gf:Math.max(0,gf),gs:Math.max(0,gs)};
      }
    }
  }
  return null;
}
function isTeamText(s){ return s && /[A-Za-zÀ-ÿ]{3}/.test(s) && s.length<=45 && !/^(classifica|risultati|calendario|giornata|squadra|punti|pt|tutte|casa|fuori|andata|ritorno|marcatori|totale|partite|news|home)$/i.test(s.trim()); }
function parsePaste(text, modeSel, roundFallback){
  var toks=tokenize(text), res=[], pairs=[], rows=[];
  var ctx={round:null,date:null,time:null,gir:null,cat:null};
  var tg=(String(S.settings.girone||"").match(/girone\s+([A-Z]{1,2})\b/i)||[])[1];
  var tc=/terza/i.test(S.settings.girone)?"TERZA":/prima/i.test(S.settings.girone)?"PRIMA":/seconda/i.test(S.settings.girone)?"SECONDA":null;
  var sawGir=false;
  function ok(){ if(ctx.cat && tc && ctx.cat.indexOf(tc)<0) return false; if(ctx.cat && /COPPA/.test(ctx.cat)) return false; if(tg && ctx.gir && ctx.gir!==tg.toUpperCase()) return false; return true; }
  for(var i=0;i<toks.length;i++){
    var t=toks[i];
    if(t.t==="GIRONE"){ ctx.gir=t.v; sawGir=true; ctx.round=null; continue; }
    if(t.t==="CAT"){ ctx.cat=t.v; ctx.gir=null; continue; }
    if(t.t==="ROUND"){ ctx.round=t.v; continue; }
    if(!ok()) continue;
    if(t.t==="DATE"){ ctx.date=t.v; ctx.time=null; continue; }
    if(t.t==="TIME"){ ctx.time=t.v; continue; }
    if(t.t==="RESULT"){ res.push({h:t.h,a:t.a,hg:t.hg,ag:t.ag,round:ctx.round,date:ctx.date,time:ctx.time}); continue; }
    if(t.t==="PAIR"){ pairs.push({h:t.h,a:t.a,round:ctx.round,date:ctx.date,time:ctx.time}); continue; }
    if(t.t==="NUM" && toks[i+1] && toks[i+1].t==="TEXT" && isTeamText(toks[i+1].v)){
      var nums=[], k=i+2; while(toks[k] && toks[k].t==="NUM" && !(toks[k+1] && toks[k+1].t==="TEXT" && isTeamText(toks[k+1].v) && nums.length>=5)){ nums.push(toks[k].v); k++; }
      if(nums.length>=5 && t.v>=1 && t.v<=40){ var sv=solveRow(nums); if(sv){ sv.pos=t.v; sv.name=toks[i+1].v; rows.push(sv); i=k-1; continue; } }
    }
    if(t.t==="TEXT" && isTeamText(t.v) && toks[i+1] && toks[i+1].t==="NUM"){
      var nn=[], q=i+1; while(toks[q] && toks[q].t==="NUM"){ nn.push(toks[q].v); q++; }
      if(nn.length>=7){ var sv2=solveRow(nn); if(sv2){ sv2.pos=rows.length+1; sv2.name=t.v; rows.push(sv2); i=q-1; continue; } }
    }
    if(t.t==="TEXT" && isTeamText(t.v)){
      var n1=toks[i+1], n2=toks[i+2], n3=toks[i+3], n4=toks[i+4];
      if(n1&&n1.t==="SCORE"&&n2&&n2.t==="TEXT"&&isTeamText(n2.v)){ res.push({h:t.v,a:n2.v,hg:n1.hg,ag:n1.ag,round:ctx.round,date:ctx.date,time:ctx.time}); i+=2; continue; }
      if(n1&&n1.t==="NUM"&&n1.v<=30&&n2&&n2.t==="DASH"&&n3&&n3.t==="NUM"&&n3.v<=30&&n4&&n4.t==="TEXT"&&isTeamText(n4.v)){ res.push({h:t.v,a:n4.v,hg:n1.v,ag:n3.v,round:ctx.round,date:ctx.date,time:ctx.time}); i+=4; continue; }
      if(n1&&n1.t==="NUM"&&n1.v<=30&&n2&&n2.t==="NUM"&&n2.v<=30&&n3&&n3.t==="TEXT"&&isTeamText(n3.v)&&!(n4&&n4.t==="NUM")){ res.push({h:t.v,a:n3.v,hg:n1.v,ag:n2.v,round:ctx.round,date:ctx.date,time:ctx.time}); i+=3; continue; }
      if(n1&&n1.t==="DASH"&&n2&&n2.t==="TEXT"&&isTeamText(n2.v)){ pairs.push({h:t.v,a:n2.v,round:ctx.round,date:ctx.date,time:ctx.time}); i+=2; continue; }
    }
  }
  if(modeSel==="tab"){ res=[]; pairs=[]; }
  if(modeSel==="res"){ rows=[]; }
  if(modeSel==="auto" && rows.length>=4 && !res.length){ pairs=[]; }
  else if(modeSel==="auto" && rows.length<4){ rows=[]; }
  var newTeams=[];
  function resolve(name){
    var t=findTeam(name,newTeams); if(t) return t;
    t={id:uid("t"),name:name.replace(/\s+/g," ").trim(),isNew:true}; newTeams.push(t); return t;
  }
  rows.forEach(function(r){ r.team=resolve(r.name); });
  res.forEach(function(r){ r.home=resolve(r.h); r.away=resolve(r.a); r.round=r.round||roundFallback||null; });
  var manyPairs=pairs.length>=3;
  pairs=pairs.filter(function(p){ return (findTeam(p.h,newTeams)&&findTeam(p.a,newTeams)) || (manyPairs && isTeamText(p.h) && isTeamText(p.a)); });
  pairs.forEach(function(p){ p.home=resolve(p.h); p.away=resolve(p.a); p.round=p.round||roundFallback||null; });
  var items=[];
  res.forEach(function(r){ var ex=findMatch(r.home.id,r.away.id); items.push({kind:"res",on:true,home:r.home,away:r.away,hg:r.hg,ag:r.ag,round:r.round,date:r.date,time:r.time,exists:!!ex}); });
  pairs.forEach(function(p){ var ex=findMatch(p.home.id,p.away.id); items.push({kind:"fix",on:!(ex&&played(ex)),home:p.home,away:p.away,round:p.round,date:p.date,time:p.time,exists:!!ex}); });
  return {items:items, rows:rows, newTeams:newTeams};
}

  }
  h+='<button class="btn primary" type="button" data-act="applyPaste">Importa</button>';

function applyPaste(){

  if(ds.cddel!=null){ readDraft(); openMatch.draft.cards.splice(+ds.cddel,1); drawMatch(); return; }
  if(ds.delteam){
    var tid=ds.delteam, cnt=S.matches.filter(function(m){return involves(m,tid);}).length;
    $("delTeamConfirm").innerHTML='<div class="note row" style="flex-wrap:wrap"><span class="grow">Eliminare <strong>'+esc(tname(tid))+'</strong>'+(cnt?' e le sue '+cnt+' partite':'')+'?</span><button class="btn danger" type="button" data-act="delTeam" data-id="'+tid+'">Elimina</button><button class="btn" type="button" data-act="cancelDel">Annulla</button></div>';
    return;
  }
  switch(ds.act){
    case "close": $("dlg").close(); break;
    case "addSc": readDraft(); openMatch.draft.scorers.push({playerId:"",min:""}); drawMatch(); break;
    case "addCd": readDraft(); openMatch.draft.cards.push({playerId:"",type:"y"}); drawMatch(); break;
    case "saveMatch": saveMatch(); break;
    case "askDelMatch": $("mDelZone").innerHTML='<div class="note row" style="flex-wrap:wrap"><span class="grow">Eliminare questa partita?</span><button class="btn danger" type="button" data-act="delMatch">Elimina</button><button class="btn" type="button" data-act="cancelDelMatch">Annulla</button></div>'; break;
    case "cancelDelMatch": drawMatch(); break;
    case "delMatch": var did=openMatch.draft.id; S.matches=S.matches.filter(function(m){return m.id!==did;}); $("dlg").close(); save(); toast("Partita eliminata"); break;
    case "askDelPlayer": $("pDelZone").innerHTML='<div class="note row" style="flex-wrap:wrap"><span class="grow">Eliminare il giocatore? Spariscono anche i suoi gol e cartellini.</span><button class="btn danger" type="button" data-act="delPlayer">Elimina</button></div>'; break;
    case "delPlayer": var pid=openPlayer.cur.id; S.players=S.players.filter(function(p){return p.id!==pid;}); S.matches.forEach(function(m){ m.scorers=(m.scorers||[]).filter(function(s){return s.playerId!==pid;}); m.cards=(m.cards||[]).filter(function(c){return c.playerId!==pid;}); }); $("dlg").close(); save(); toast("Giocatore eliminato"); break;
    case "delTeam": var t2=b.dataset.id; S.teams=S.teams.filter(function(t){return t.id!==t2;}); S.matches=S.matches.filter(function(m){return !involves(m,t2);}); if(S.imported) S.imported.rows=S.imported.rows.filter(function(r){return r.teamId!==t2;}); save(); toast("Squadra eliminata"); break;
    case "cancelDel": $("delTeamConfirm").innerHTML=""; break;
    case "parse":
      var txt=$("pasteBox").value;
      if(!txt.trim()){ toast("Incolla prima il testo copiato da Tuttocampo"); return; }
      parsed=parsePaste(txt,$("pasteMode").value,$("pasteRound").value?+$("pasteRound").value:null); drawPreview(); break;
    case "applyPaste": applyPaste(); break;
    case "saveSettings":
      S.settings.myTeamId=$("setMy").value||S.settings.myTeamId; S.settings.season=$("setSeason").value.trim()||S.settings.season;
      S.settings.girone=$("setGirone").value.trim()||S.settings.girone;
      var lk=$("setLink").value.trim(); S.settings.tcLink=/^https:\/\//i.test(lk)?lk:"";
      save(); toast("Impostazioni salvate"); break;
    case "reseed": loadSeed(true); break;
    case "backup":
      if(!downloads){ try{ var bl=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}), a=document.createElement("a"); a.href=URL.createObjectURL(bl); a.download="data.json"; document.body.appendChild(a); a.click(); a.remove(); toast("Copia scaricata come data.json"); }catch(e){ toast("Download non riuscito"); } return; }
      downloads.save({filename:"baggese-"+S.settings.season.replace(/\W+/g,"-")+".json", data:JSON.stringify(S,null,2)}).then(function(){toast("Copia scaricata");}).catch(function(err){ if(!err||err.code!=="declined") toast("Download non riuscito"); });
      break;
    case "restore":
      if(restorePending){ S=normalize(restorePending); restorePending=null; ensureMyTeam(); save(); toast("Dati ripristinati"); }
      break;
    case "cancelRestore": restorePending=null; $("restoreConfirm").innerHTML=""; break;
  }
});
document.addEventListener("change", function(e){
  var t=e.target;
  if(t.dataset && t.dataset.pi!=null && parsed){ parsed.items[+t.dataset.pi].on=t.checked; return; }
  if(t.dataset && (t.dataset.kc1||t.dataset.kc2||t.dataset.kpat)){ var kid=t.dataset.kc1||t.dataset.kc2||t.dataset.kpat, ktm=team(kid); if(ktm){ var kk=kit(kid); ktm.kit={c1:kk.c1,c2:kk.c2,pat:kk.pat}; if(t.dataset.kc1) ktm.kit.c1=hex(t.value,kk.c1); if(t.dataset.kc2) ktm.kit.c2=hex(t.value,kk.c2); if(t.dataset.kpat) ktm.kit.pat=t.value; save(); } return; }
  if(t.dataset && t.dataset.logo){ processLogo(t.files&&t.files[0], t.dataset.logo); t.value=""; return; }
  if(t.dataset && t.dataset.rename){ var tm=team(t.dataset.rename), v=t.value.trim(); if(tm&&v&&v!==tm.name){ tm.name=v; save(); toast("Nome aggiornato"); } return; }
  if(t.id==="restoreFile" && t.files && t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){ try{ var d=JSON.parse(fr.result); if(!d||!Array.isArray(d.teams)) throw 0; restorePending=d; $("restoreConfirm").innerHTML='<div class="note row" style="flex-wrap:wrap"><span class="grow">Sostituire tutti i dati attuali con quelli del file ('+d.teams.length+' squadre, '+(d.matches||[]).length+' partite)?</span><button class="btn danger" type="button" data-act="restore">Sostituisci</button><button class="btn" type="button" data-act="cancelRestore">Annulla</button></div>'; } catch(err){ toast("Il file non è una copia valida di questa app"); } t.value=""; };
    fr.readAsText(t.files[0]);
  }
});
var restorePending=null;
document.addEventListener("submit", function(e){
  e.preventDefault();
  if(e.target.id==="addTeamForm"){ var n=$("newTeam").value.trim(); if(!n) return; if(findTeam(n)){ toast("Questa squadra c’è già"); return; } S.teams.push({id:uid("t"),name:n}); save(); toast("Squadra aggiunta"); setTimeout(function(){var x=$("newTeam"); if(x) x.focus();},50); }
  if(e.target.id==="playerForm"){
    var p=openPlayer.cur, name=$("pName").value.trim(); if(!name) return;
    var rec={id:p.id||uid("p"), teamId:p.teamId||curRosaTeam(), tc:p.tc||null, num:$("pNum").value?+$("pNum").value:"", name:name, role:$("pRole").value};
    if(p.id) S.players=S.players.map(function(x){return x.id===p.id?rec:x;}); else S.players.push(rec);
    $("dlg").close(); save(); toast("Giocatore salvato");
  }
});
$("dlg").addEventListener("click", function(e){ if(e.target===this) this.close(); });

render(); boot();
if(typeof module!=="undefined") module.exports.parse=parsePaste, module.exports.S=function(){return S;}, module.exports.apply=function(p){parsed=p;applyPaste();};
})();
</script>
</body>
</html>
