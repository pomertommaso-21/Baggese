.ct-head .th.on{color:var(--fg)}
</style>

<style>
/* Layout: app a colonna unica su telefono (barra in basso), barra laterale da 232px sopra i 960px. Colori della Baggese: rosso e bianco; grafite per le altre squadre; stemmi in cornice tonda uniforme */
:root{
  --bg:#F1F1F3; --surface:#FFFFFF; --surface-2:#F4F4F6; --line:#E2E2E7; --card-border:transparent;
  --fg:#141418; --muted:#5D5D68;
  --night:#18181C; --night-2:#27272D; --on-night:#F6F6F8; --on-night-muted:#B4B4BE; --night-line:rgba(255,255,255,.08);
  --brand:var(--a-brand,#C8202A); --brand-deep:var(--a-deep,#991620); --on-brand:#FFFFFF; --mine:var(--a-mine,#FCEAEB); --mine-ink:var(--a-ink,#991620);
  --z-promo:#0E9F6E; --z-po:#2F6FDB; --z-pl:#E8890C; --z-rel:#D64545;
  --gm1:#F6C2C5; --gm1-ink:#8E141D; --gm3:#7A0F17; --gm3-ink:#FFFFFF;
  --win:#16934F; --draw:#73737F; --loss:#D63F2D; --yellow:#F2B705; --red:#D93025;
  --win-bg:#E2F3E9; --win-ink:#11773F; --draw-bg:#EBEBEF; --draw-ink:#55555F; --loss-bg:#FBE5E2; --loss-ink:#B5301E;
  --glass:rgba(255,255,255,.72); --glass-strong:rgba(244,244,246,.94); --glass-line:rgba(20,20,24,.09);
  --lg-bg:rgba(250,250,252,.62); --lg-line:rgba(255,255,255,.7); --lg-hi:rgba(255,255,255,.9); --lg-pill:color-mix(in srgb,var(--brand) 13%,rgba(255,255,255,.55)); --lg-pill-line:rgba(255,255,255,.75);
  --ring:rgba(20,20,24,.07); --active:#18181C; --on-active:#F6F6F8;
  --shadow:0 1px 2px rgba(20,20,24,.04),0 8px 24px -16px rgba(20,20,24,.16);
  --display:"Inter Display","Inter",-apple-system,"SF Pro Display",system-ui,sans-serif;
  --body:"Inter",-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0B0D; --surface:#161618; --surface-2:#202024; --line:#2D2D33; --card-border:#232328;
  --fg:#EDEDF1; --muted:#A0A0AC;
  --night:#1C1C21; --night-2:#2A2A31; --on-night:#F6F6F8; --on-night-muted:#B4B4BE; --night-line:rgba(255,255,255,.08);
  --brand:var(--a-brand-d,#D42F39); --brand-deep:var(--a-deep-d,#A61C26); --on-brand:#FFFFFF; --mine:var(--a-mine-d,#3A1C1F); --mine-ink:var(--a-ink-d,#FF9CA2);
  --z-promo:#1FA874; --z-po:#5B8EF0; --z-pl:#C47410; --z-rel:#E06565;
  --gm1:#5A2327; --gm1-ink:#FFB6BB; --gm3:#8E141D; --gm3-ink:#FFFFFF;
  --win:#2DB56B; --draw:#8A8A96; --loss:#F2604C; --yellow:#F2B705; --red:#E5483D;
  --win-bg:rgba(45,181,107,.17); --win-ink:#52D18F; --draw-bg:rgba(160,160,172,.16); --draw-ink:#B9B9C4; --loss-bg:rgba(242,96,76,.17); --loss-ink:#FF8270;
  --glass:rgba(24,24,27,.72); --glass-strong:rgba(14,14,16,.94); --glass-line:rgba(255,255,255,.08);
  --lg-bg:rgba(30,30,34,.58); --lg-line:rgba(255,255,255,.1); --lg-hi:rgba(255,255,255,.14); --lg-pill:color-mix(in srgb,var(--brand) 26%,rgba(255,255,255,.08)); --lg-pill-line:rgba(255,255,255,.14);
  --ring:rgba(255,255,255,.16); --active:#EDEDF1; --on-active:#141418;
  --shadow:0 12px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0B0D; --surface:#161618; --surface-2:#202024; --line:#2D2D33; --card-border:#232328;
  --fg:#EDEDF1; --muted:#A0A0AC;
  --night:#1C1C21; --night-2:#2A2A31; --on-night:#F6F6F8; --on-night-muted:#B4B4BE; --night-line:rgba(255,255,255,.08);
  --brand:var(--a-brand-d,#D42F39); --brand-deep:var(--a-deep-d,#A61C26); --on-brand:#FFFFFF; --mine:var(--a-mine-d,#3A1C1F); --mine-ink:var(--a-ink-d,#FF9CA2);
  --z-promo:#1FA874; --z-po:#5B8EF0; --z-pl:#C47410; --z-rel:#E06565;
  --gm1:#5A2327; --gm1-ink:#FFB6BB; --gm3:#8E141D; --gm3-ink:#FFFFFF;
  --win:#2DB56B; --draw:#8A8A96; --loss:#F2604C; --yellow:#F2B705; --red:#E5483D;
  --win-bg:rgba(45,181,107,.17); --win-ink:#52D18F; --draw-bg:rgba(160,160,172,.16); --draw-ink:#B9B9C4; --loss-bg:rgba(242,96,76,.17); --loss-ink:#FF8270;
  --glass:rgba(24,24,27,.72); --glass-strong:rgba(14,14,16,.94); --glass-line:rgba(255,255,255,.08);
  --lg-bg:rgba(30,30,34,.58); --lg-line:rgba(255,255,255,.1); --lg-hi:rgba(255,255,255,.14); --lg-pill:color-mix(in srgb,var(--brand) 26%,rgba(255,255,255,.08)); --lg-pill-line:rgba(255,255,255,.14);
  --ring:rgba(255,255,255,.16); --active:#EDEDF1; --on-active:#141418;
  --shadow:0 12px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(112px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-optical-sizing:auto;letter-spacing:-.03em;line-height:1.05}
h1{font-size:clamp(30px,8vw,40px);font-weight:800}
h2{font-family:var(--body);font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
h3{font-family:var(--body);line-height:1.2}
.num{font-variant-numeric:tabular-nums}
.muted,.meta{color:var(--muted)} .meta{font-size:13px}
.small{font-size:13px} .tiny{font-size:12px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* stemmi: stessa cornice per tutti */
.crest{width:var(--s);height:var(--s);flex:none;border-radius:50%;background:#FFFFFF;box-shadow:0 0 0 1px var(--ring);display:inline-flex;align-items:center;justify-content:center;overflow:hidden}
.crest svg{width:70%;height:80%;display:block}
.crest img{width:78%;height:78%;object-fit:contain;display:block}
.crest.lit{box-shadow:0 0 0 3px var(--brand),0 2px 10px -2px rgba(0,0,0,.4)}
.hero .crest.lit{box-shadow:0 0 0 3px #FFFFFF,0 4px 14px -4px rgba(0,0,0,.45)}

/* superfici */
html:not([data-curtab="home"]) .card,html:not([data-curtab="home"]) .rchip,html:not([data-curtab="home"]) .seg,html:not([data-curtab="home"]) .block{box-shadow:none}
.card{background:var(--surface);border:1px solid var(--card-border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flush{padding:6px 10px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.night{background:var(--night);color:var(--on-night);border-radius:24px;padding:20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.night .muted,.night .meta{color:var(--on-night-muted)}
.pitch::before{content:"";position:absolute;left:50%;top:50%;width:300px;height:300px;transform:translate(-50%,-50%);border:2px solid var(--night-line);border-radius:50%;pointer-events:none}
.pitch::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-1px);background:var(--night-line);pointer-events:none}
.night>*{position:relative;z-index:1}
.hero{background:radial-gradient(130% 100% at 50% 0%,var(--brand) 0%,var(--brand-deep) 100%);color:#FFFFFF;--night-line:rgba(255,255,255,.16);--on-night-muted:rgba(255,255,255,.82);--night-2:rgba(0,0,0,.18)}

/* testata */
.top{display:flex;align-items:center;gap:14px}
.pos-chip{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;padding:8px 10px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--card-border)}
.pos-chip b{font-family:var(--display);letter-spacing:-.02em;font-size:26px;font-weight:800;line-height:1}
.pos-chip span{font-size:12px;color:var(--muted);font-weight:600}

/* home */
.home-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.hero-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero-top .eyebrow{color:var(--on-night)}
.hero-date{font-size:14px;font-weight:600;color:var(--on-night-muted)}
.match-up{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;margin:22px 0 18px}
.side{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-width:0}
.side strong{font-size:16px;line-height:1.2;font-weight:700;overflow-wrap:normal;hyphens:none}
.side span{font-size:12.5px;color:var(--on-night-muted);font-weight:500}
.mid{display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 4px}
.vs{font-family:var(--display);letter-spacing:-.02em;font-size:24px;font-weight:800;color:var(--on-night-muted);letter-spacing:.04em}
.countdown{background:#FFFFFF;color:var(--brand-deep);font-weight:700;font-size:12px;border-radius:999px;padding:4px 10px;white-space:nowrap}
.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px;border-top:1px solid var(--night-line);flex-wrap:wrap}
.hero-foot span{font-size:13px;color:var(--on-night-muted);font-weight:600}
.t-sc{font-size:12px;font-weight:500;color:var(--muted);line-height:1.45}
.scoreline .t{align-self:start}
.scoreline .big-score{align-self:start;margin-top:3px}
.scoreline{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;background:none;border:0;padding:0;color:inherit;text-align:left;width:100%}
.scoreline .t{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-weight:600;font-size:14px;line-height:1.2;overflow-wrap:normal;hyphens:none}
.big-score{font-family:var(--display);letter-spacing:-.02em;font-weight:800;font-size:46px;line-height:.9;font-variant-numeric:tabular-nums;white-space:nowrap}
.big-score i{font-style:normal;color:var(--muted);padding:0 4px}
.form-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.form-item{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-2);border:0;border-radius:14px;padding:10px 4px;color:inherit}
.res-dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;font-weight:800;font-size:12px;flex:none}
.res-pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.r-V{background:var(--win-bg);color:var(--win-ink)} .r-N{background:var(--draw-bg);color:var(--draw-ink)} .r-P{background:var(--loss-bg);color:var(--loss-ink)}
.mini-row{display:grid;grid-template-columns:24px auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 8px;border-radius:12px;font-size:14px}
.mini-row.me{font-weight:700;color:var(--brand)}
button.mini-row{background:none;border:0;width:100%;color:inherit;text-align:left;font:inherit;font-size:14px}

.mini-row b{font-family:var(--display);letter-spacing:-.02em;font-size:17px;font-weight:800}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:3px}
.scorer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.scorer b{font-family:var(--display);letter-spacing:-.02em;font-size:19px;font-weight:800;grid-row:span 2}

/* partite */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.rchip{flex:none;min-width:38px;height:38px;border-radius:11px;border:1px solid var(--card-border);background:var(--surface);box-shadow:var(--shadow);font-family:var(--display);letter-spacing:-.02em;font-weight:800;font-size:15px;color:var(--fg)}
.rchip.future{color:var(--muted)}
.rchip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:transparent}
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;width:100%;padding:12px 6px;background:none;border:0;border-top:1px solid var(--line);color:inherit;text-align:left}
.list>.board:first-child,.list>.fx:first-child,.list>.pl:first-child{border-top:0}
.board.is-me .nm{color:var(--brand);font-weight:700}

.b-team{display:flex;align-items:center;gap:10px;justify-content:flex-end;min-width:0;font-weight:600;font-size:14px}
.b-team.away{justify-content:flex-start}
.b-team .nm{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2;overflow-wrap:normal;hyphens:none}
.b-team{text-align:right}.b-team.away{text-align:left}
.b-score{min-width:56px;text-align:center;font-family:var(--display);letter-spacing:-.02em;font-weight:800;font-size:20px;padding:5px 4px;line-height:1;font-variant-numeric:tabular-nums}
.b-score i{font-style:normal;color:var(--muted);padding:0 3px}
.b-score small{font-family:var(--body);font-size:11.5px;font-weight:600;color:var(--muted);display:block;line-height:1.25}
.fx{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:12px 4px;background:none;border:0;border-top:1px solid var(--line);color:inherit;text-align:left}
.fx-round{font-family:var(--display);letter-spacing:-.02em;font-weight:800;font-size:17px;color:var(--muted);text-align:center}
.fx-main{display:flex;align-items:center;gap:12px;min-width:0}
.fx-main b{font-weight:700;font-size:15px}
.fx-score{display:flex;align-items:center;gap:8px;font-family:var(--display);letter-spacing:-.02em;font-weight:800;font-size:19px}
.split{display:flex;align-items:center;gap:10px;margin:6px 4px 2px}
.split::after{content:"";flex:1;height:1px;background:var(--line)}

.sc-line{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 68px minmax(0,1fr);gap:10px;font-size:12px;color:var(--muted);line-height:1.35;margin-top:4px}
.sc-line span:first-child{text-align:right}
.fx-sc{display:flex;align-items:flex-start;gap:5px;font-size:12.5px;color:var(--muted);margin-top:2px}
.fx-sc svg.i{width:14px;height:14px;margin-top:1px}
.mv-head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:8px 0}
.mv-head .side strong{font-size:15px}
.mv-status{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mv-empty{text-align:center;color:var(--muted);font-size:14px;padding:14px;background:var(--surface-2);border-radius:14px}
.tl{display:flex;flex-direction:column;gap:4px;position:relative;padding:6px 0}
.tl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-1px);background:var(--line)}
.tl-row{display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);align-items:center;gap:8px;position:relative;font-size:14px}
.tl-row .tl-score{grid-column:2;grid-row:1;justify-self:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px;font-weight:800;z-index:1}
.tl-row.h .tl-who{grid-column:1;grid-row:1;text-align:right}
.tl-row.a .tl-who{grid-column:3;grid-row:1}
.tl-row .tl-min{grid-row:1;font-family:var(--display);letter-spacing:-.02em;font-weight:800;font-size:14px;color:var(--muted)}
.tl-row.h .tl-min{grid-column:3}
.tl-row.a .tl-min{grid-column:1;text-align:right}
.tl-row b{font-weight:700}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mine-ink);background:var(--mine);border-radius:5px;padding:1px 5px;vertical-align:1px}
.mv-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;background:var(--surface-2);border-radius:14px;padding:12px}
.mv-cols ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.mv-cols li{display:flex;gap:6px;align-items:flex-start}
.mv-cols ul.r li{flex-direction:row-reverse;text-align:right}
.ball svg.i{width:15px;height:15px;margin-top:2px;color:var(--muted)}
/* classifica */
.tbl{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:14px}
th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 6px;text-align:center;white-space:nowrap}
td{padding:9px 6px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
td.name,th.name{text-align:left}
td.name{min-width:150px}
tr.me td{color:var(--brand);font-weight:700}


.pts{font-family:var(--display);letter-spacing:-.02em;font-weight:800;font-size:18px}
.tcell{display:flex;align-items:center;gap:10px;font-weight:600}
.posn{font-family:var(--display);letter-spacing:-.02em;font-weight:800;font-size:15px;color:var(--muted)}
tr.me .posn{color:var(--brand)}
.fdots{display:inline-flex;gap:3px}
.fdots span{width:18px;height:18px;border-radius:5px;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}

/* squadre */
.crest-strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.crest-strip::-webkit-scrollbar{display:none}
.cpick{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;background:none;border:0;padding:4px 0;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em}
.cpick[aria-pressed="true"]{color:var(--fg)}
.team-hero{display:flex;flex-direction:column;gap:18px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--night-2);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.stat b{font-family:var(--display);letter-spacing:-.02em;font-size:clamp(17px,4.8vw,23px);white-space:nowrap;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--on-night-muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pl{display:grid;grid-template-columns:34px minmax(0,1fr) 40px 40px 52px;align-items:center;gap:8px;padding:10px 2px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;text-align:left;font-size:14px}
.pl-head{border-top:0;padding-top:0;padding-bottom:4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pl-head span,.pl>span:nth-child(n+3){text-align:center}
.shirt{width:32px;height:32px;display:block;justify-self:center}
.pav{width:34px;height:34px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.02em}
.pav.mine{background:var(--mine);color:var(--mine-ink)}
.num-badge{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);letter-spacing:-.02em;font-weight:800;font-size:14px}
.pl b{font-weight:700}
.pl-nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25;overflow-wrap:anywhere}
@media (max-width:420px){.pl{grid-template-columns:30px minmax(0,1fr) 34px 34px 44px;gap:6px}}
.pgol{font-family:var(--display);letter-spacing:-.02em;font-weight:800;font-size:17px}
.card-y,.card-r{display:inline-block;width:9px;height:13px;border-radius:2px;vertical-align:-1px}
.card-y{background:var(--yellow)} .card-r{background:var(--red)}
.cards{display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:13px}

/* controlli */
button,.btn{font:inherit;cursor:pointer}
.btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:700;font-size:14px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:transparent}
.btn.flood{background:#FFFFFF;color:var(--brand-deep);border-color:transparent}
.btn.dark{background:var(--active);color:var(--on-active);border-color:transparent}
.btn.danger{color:var(--loss)}
.btn.ghost{border-style:dashed;background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;color:var(--fg);font-weight:700;font-size:13px;min-height:36px;padding:0 4px;text-decoration:underline;text-decoration-color:var(--brand);text-decoration-thickness:2px;text-underline-offset:4px}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.hero :focus-visible{outline-color:#FFFFFF}
@media (hover:none) and (pointer:coarse){:focus-visible{outline:none}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--shadow);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:700;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--active);color:var(--on-active)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 12px;width:100%;min-width:0}
input[type="color"]{padding:4px;width:44px;flex:none;cursor:pointer}
textarea{padding:10px 12px;min-height:150px;resize:vertical;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.list{display:flex;flex-direction:column}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.note{font-size:13px;background:var(--mine);color:var(--fg);border-radius:12px;padding:10px 12px}
.pill{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--fg)}
.pill.new{background:var(--brand);color:var(--on-brand)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--win)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 7px;border-radius:8px;font-size:12px;font-weight:800}
.b-V{background:var(--win-bg);color:var(--win-ink)} .b-N{background:var(--draw-bg);color:var(--draw-ink)} .b-P{background:var(--loss-bg);color:var(--loss-ink)}
.dot{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted)}
.score{font-family:var(--display);letter-spacing:-.02em;font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.team-edit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.team-edit:first-child{border-top:0}
.team-edit .ctrls{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.team-edit .ctrls select{width:auto;flex:1 1 150px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* zone di classifica, frecce, grafico */
tr[data-z] td:first-child{box-shadow:inset 2px 0 0 var(--zc)}
.mini-row[data-z]{box-shadow:inset 2px 0 0 var(--zc)}
.pcell{position:relative;display:inline-flex;flex-direction:column;align-items:center;min-width:26px}

.mv{flex:none;font-size:10px;font-weight:700;line-height:1;white-space:nowrap;padding:0;margin-left:4px;background:none!important}
.mv.up{color:var(--win);background:color-mix(in srgb,var(--win) 13%,transparent)} .mv.dn{color:var(--loss);background:color-mix(in srgb,var(--loss) 13%,transparent)} .mv.eq{color:var(--muted);font-weight:600}
.zleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:-4px}
.zleg i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.zok{display:inline-flex;align-items:center;gap:3px;color:var(--z-promo,#1e9e5a);font-weight:600;margin-left:auto}.zok svg.i{width:12px;height:12px}
.tbtn{display:flex;align-items:center;gap:10px;font-weight:600;background:none;border:0;padding:0;color:inherit;text-align:left;min-height:34px}
.tbtn:hover span{text-decoration:underline;text-underline-offset:3px}
.plink{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:700;text-align:inherit;cursor:pointer}
.plink:hover{text-decoration:underline;text-decoration-color:var(--brand);text-decoration-thickness:2px;text-underline-offset:3px}
.pchart{position:relative}
.pchart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.pchart .ax{font-family:var(--body);font-size:11px;fill:var(--muted);font-weight:600}
.pchart .grid{stroke:var(--line);stroke-width:1}
.pchart .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;opacity:0}
.pchart.on .xh{opacity:1}
.ptip{position:absolute;top:0;pointer-events:none;background:var(--night);color:var(--on-night);border-radius:10px;padding:6px 9px;font-size:12px;font-weight:600;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s}
.ptip b{font-family:var(--display);letter-spacing:-.02em;font-size:15px;font-weight:800;margin-right:4px}
.pchart.on .ptip{opacity:1}
/* verso la partita */
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px 12px}
.cmp>.l{text-align:right;justify-self:end}
.cmp>.r{text-align:left;justify-self:start}
.cmp>.k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;min-width:76px}
.cmp .v{font-family:var(--display);letter-spacing:-.02em;font-size:21px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.cmp .v.lo{color:var(--muted)}
.cmp-head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.cmp-head>:first-child{justify-self:end} .cmp-head>:last-child{justify-self:start}
.cmp .who{display:flex;flex-direction:column;gap:2px;font-size:13.5px;line-height:1.25}
.and-chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:0;border-radius:12px;padding:6px 10px;font-weight:700;font-size:13px;color:inherit}
.and-chip .num{font-family:var(--display);letter-spacing:-.02em;font-size:16px;font-weight:800}
/* scheda giocatore */
.ps-head{display:flex;align-items:center;gap:14px}
.ps-head h2{font-family:var(--display);letter-spacing:-.025em;font-size:26px;font-weight:800;line-height:1.1}
.stats.light .stat{background:var(--surface-2)}
.stats.light .stat span{color:var(--muted)}
.rank-line{display:flex;align-items:center;gap:12px;background:var(--mine);color:var(--fg);border-radius:14px;padding:10px 14px;font-size:14px}
.rank-line b{font-family:var(--display);letter-spacing:-.02em;font-size:26px;font-weight:800;color:var(--mine-ink);line-height:1}
.gl{display:grid;grid-template-columns:28px auto minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;padding:10px 4px;background:none;border:0;border-top:1px solid var(--line);color:inherit;text-align:left;font-size:14px}
.gl:first-child{border-top:0}
.gl .fx-round{font-size:18px}
.gl .gmin{font-size:12px;color:var(--muted)}
.segfloat{position:fixed;left:0;right:0;top:var(--tbh,50px);z-index:5;padding:8px 16px 10px;background:var(--bg);border-bottom:1px solid var(--line);transform:translateY(calc(-100% - var(--tbh,50px)));opacity:0;visibility:hidden;transition:transform .32s cubic-bezier(.22,.9,.25,1),opacity .2s ease,visibility 0s .32s}
body.segup .segfloat{transform:none;opacity:1;visibility:visible;transition:transform .32s cubic-bezier(.22,.9,.25,1),opacity .2s ease,visibility 0s}
body.segup .topbar{border-bottom-color:transparent}
.segfloat .seg{margin:0}
@media (min-width:960px){.segfloat{left:232px}}

html,body{overflow-x:hidden;overscroll-behavior-x:none}
@supports (overflow:clip){html,body{overflow-x:clip}}
#app{overflow-x:clip}
.rc-vp{position:relative;overflow-x:clip;margin:0 -16px;padding:0 16px;touch-action:pan-y}
.rc-slot{will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.rc-slot.rc-side{position:absolute;top:0;left:16px;right:16px;pointer-events:none}

.rc-card{contain:layout style}
.cmp-head.big{margin:6px 0 6px}
.fx-mini{display:grid;grid-template-columns:30px 22px minmax(0,1fr) 40px minmax(0,1fr) 22px 64px;align-items:center;gap:6px;width:100%;padding:9px 0;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;font-size:14px}
.fx-mini:first-child{border-top:0}.fx-mini b{text-align:center}.fx-mini .meta:last-child{text-align:right;white-space:nowrap}
#ctx{position:fixed;inset:0;z-index:900;pointer-events:none}
#ctx.on{pointer-events:auto}
.ctx-bg{position:absolute;inset:0;background:rgba(0,0,0,.18);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transition:opacity .2s}
#ctx.on .ctx-bg{opacity:1}
.ctx-row{position:absolute;background:var(--surface);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);transform:scale(1);transition:transform .25s cubic-bezier(.32,.72,0,1);overflow:hidden}
#ctx.on .ctx-row{transform:scale(1.03)}
.ctx-menu{position:absolute;width:250px;background:var(--surface);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.22);overflow:hidden;transform-origin:top left;transform:scale(.85);opacity:0;transition:transform .25s cubic-bezier(.32,.72,0,1),opacity .2s}
#ctx.on .ctx-menu{transform:none;opacity:1}
.ctx-menu button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 16px;border:0;border-top:1px solid var(--line);background:none;color:var(--fg);font:inherit;font-size:16px;text-align:left}
.ctx-menu button:first-child{border-top:0}.ctx-menu svg{width:18px;height:18px;color:var(--muted)}


.vok{display:flex;align-items:center;gap:6px;color:var(--z-promo,#1e9e5a);font-weight:600}.vok svg{width:14px;height:14px}
.vdiff svg{width:20px;height:20px;flex:none;color:#d98a00;margin-top:2px}
.bk-code{width:100%;box-sizing:border-box;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);resize:none;word-break:break-all}
@supports (-webkit-touch-callout:none){.bk-code{font-size:16px}}
.gl .gcnt{font-size:13px;font-weight:700;color:var(--muted);min-width:24px;text-align:right}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:720px){.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rnav{display:flex;gap:6px}
.rnav .btn{width:40px;padding:0}

/* classifica e marcatori su telefono: niente scorrimento laterale */
@media (max-width:719px){.only-wide{display:none!important}}
@media (min-width:720px){.only-narrow{display:none!important}}
.ct-head,.crow-main{display:grid;grid-template-columns:25px minmax(0,1fr) 18px 21px 21px 28px 28px;gap:4px;align-items:center}
.ct-head{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 0 6px}
.ct-head span,.crow .c{text-align:center}
.crow{border-top:1px solid var(--line);box-shadow:inset 2px 0 0 var(--zc,transparent)}
.crow-main{width:100%;background:none;border:0;color:inherit;padding:9px 0;text-align:left;font:inherit;font-size:14px;font-variant-numeric:tabular-nums}
.crow .nm{display:flex;align-items:center;gap:6px;min-width:0;font-weight:600;font-size:13.5px;line-height:1.2;letter-spacing:-.01em}
.crow .nm>.tn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:normal;hyphens:none}
.crow .nm>.tn{flex:1 1 auto;min-width:0;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-line-clamp:none}
.crow .nm>.mv{flex:none;width:18px;margin-left:0;text-align:left;overflow:visible}
.crow .nm>.tn.fit1{font-size:12.5px}.crow .nm>.tn.fit2{font-size:11.5px;letter-spacing:-.02em}
.crow .c.dr{font-weight:700}
.crow .pts{text-align:center}
.crow.me .nm,.crow.me .pts,.crow.me .posn{color:var(--brand)} .crow.me .nm{font-weight:800}


.crow-det{display:none;flex-wrap:wrap;align-items:center;gap:6px;padding:0 6px 11px 32px;font-size:12.5px;color:var(--muted)}
.crow.open .crow-det{display:flex}
.crow-det .box{background:var(--surface);border-radius:8px;padding:4px 8px;display:inline-flex;align-items:center;gap:4px}
.crow-det b{color:var(--fg)}
.crow-det .linkbtn{min-height:30px}
.mk{display:grid;grid-template-columns:28px minmax(0,1fr) 40px;gap:8px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.mk:first-child{border-top:0}
.mk.me .plink,.mk.me .pts{color:var(--brand)}

.mk .who{display:flex;flex-direction:column;gap:4px;min-width:0}
.mk .tm{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);min-width:0}
.mk .tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk .pts{text-align:center}

/* Barra fissa in cima, a tinta piena, larga tutto lo schermo e che riceve i tocchi.
   iOS 26 toglie la sfocatura del bordo alto solo quando, 4px sotto il bordo, trova un elemento così
   (niente pointer-events:none, niente backdrop-filter o maschere): allora estende quel colore invece di sfocare. */
.sbar{position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top,0px) + 8px);background:var(--bg);z-index:8}
/* app aperta dalla Home: la barra di stato (ora, batteria) e' bianca, quindi sotto c'e' il colore della squadra; col tema scuro resta scuro */

/* titolo compatto in alto quando si scorre (stile iOS) */
.topbar{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 9px) 16px 9px;background:var(--bg);border-bottom:1px solid var(--line);font-family:var(--display);letter-spacing:-.02em;font-weight:700;font-size:17px;line-height:1;opacity:0;transform:translateY(-100%);visibility:hidden;pointer-events:none;transition:opacity .2s ease,transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s .25s}
.topbar .crest{--s:26px}
body.scrolled .topbar{opacity:1;transform:none;visibility:visible;transition:opacity .2s ease,transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){nav.tabs{background:var(--surface)}}
@media (min-width:960px){.topbar{left:232px}}
@media (prefers-reduced-motion:reduce){.topbar{transition:none}}

.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.iconbtn.on{color:var(--fg)}
.iconbtn.on::after{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 2px var(--bg)}
.fchip{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:-6px}
.fchip button{background:none;border:0;color:var(--muted);width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px}

function save(){

  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    var copy = JSON.parse(JSON.stringify(S));
    if (docRef){
      docRef.set(copy).then(function(){ pendingWrite=false; }).catch(function(e){
        pendingWrite=false;

      });
    } else {
      try { localStorage.setItem(lsKey(), JSON.stringify(copy)); } catch(e){}
      pendingWrite=false;
    }
  }, 350);
  render();
}
function normalize(d){
  var b=blank(); d=d||{};
  b.settings=Object.assign(b.settings, d.settings||{});
  b.teams=Array.isArray(d.teams)?d.teams:[]; b.matches=Array.isArray(d.matches)?d.matches:[];
  b.players=Array.isArray(d.players)?d.players:[];
  /* nomi scritti tutti minuscoli o tutti maiuscoli su Tuttocampo: "Baye niass" -> "Baye Niass", "TORQUATO" -> "Torquato" */
  var nice=function(n){ return typeof n!=="string"?n:n.replace(/[^\s'’-]+/g,function(w){ if(w.length<2) return w; return (w===w.toLowerCase()||w===w.toUpperCase())? w.charAt(0).toUpperCase()+w.slice(1).toLowerCase() : w; }); };
  b.players.forEach(function(p){ p.name=nice(p.name); });
  b.matches.forEach(function(m){ (m.scorers||[]).forEach(function(x){ if(x.name) x.name=nice(x.name); }); });
  b.imported=d.imported||null; b.updatedAt=d.updatedAt||null; if(d.tcRound!=null) b.tcRound=d.tcRound;
  return b;
}

/* versione pubblicata su GitHub: dati e app più recenti sostituiscono quelli tenuti dal telefono */

/* ---------- names ---------- */
var STOP=/^(a|s|d|asd|ssd|ssdarl|us|usd|u|ac|fc|ss|pol|polisportiva|calcio|sc|gs|cs|as|ad|arl|srl|c)$/;
function norm(n){ return String(n||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim().split(" ").filter(function(w){return w && !STOP.test(w);}).join(" "); }
function findTeam(name, extra){
  var n=norm(name); if(!n) return null;
  var pool=S.teams.concat(extra||[]), i;
  for (i=0;i<pool.length;i++) if (norm(pool[i].name)===n) return pool[i];
  for (i=0;i<pool.length;i++){ var o=norm(pool[i].name); if (o.length>=4 && n.length>=4 && (o.indexOf(n)>=0 || n.indexOf(o)>=0)) return pool[i]; }
  return null;
}

/* ---------- standings ---------- */
function standings(upTo){
  var rows={}, ms=S.matches.filter(function(m){ return played(m) && (!upTo || (m.round && +m.round<=upTo)); });
  S.teams.forEach(function(t){ rows[t.id]={id:t.id,g:0,v:0,n:0,p:0,gf:0,gs:0,pts:0,form:[]}; });
  ms.slice().sort(sortMatches).forEach(function(m){
    var h=rows[m.homeId], a=rows[m.awayId]; if(!h||!a) return;
    var hg=+m.hg, ag=+m.ag;
    h.g++; a.g++; h.gf+=hg; h.gs+=ag; a.gf+=ag; a.gs+=hg;
    if (hg>ag){ h.v++; a.p++; h.pts+=3; h.form.push("V"); a.form.push("P"); }
    else if (hg<ag){ a.v++; h.p++; a.pts+=3; a.form.push("V"); h.form.push("P"); }
    else { h.n++; a.n++; h.pts++; a.pts++; h.form.push("N"); a.form.push("N"); }
  });
  var list=Object.keys(rows).map(function(k){return rows[k];});
  list.sort(function(x,y){ return y.pts-x.pts || (y.gf-y.gs)-(x.gf-x.gs) || y.gf-x.gf || tname(x.id).localeCompare(tname(y.id)); });
  list.forEach(function(r,i){ r.pos=i+1; });
  return list;
}
function importedRows(){ if(!S.imported||!S.imported.rows) return []; return S.imported.rows.filter(function(r){return team(r.teamId);}).map(function(r){ return {id:r.teamId,pos:r.pos,g:r.g,v:r.v,n:r.n,p:r.p,gf:r.gf,gs:r.gs,pts:r.pts}; }).sort(function(a,b){return a.pos-b.pos;}); }
function currentTable(){
  var calc=standings(), imp=importedRows();
  var gCalc=calc.reduce(function(s,r){return s+r.g;},0), gImp=imp.reduce(function(s,r){return s+(+r.g||0);},0);
  var src = tableSrc || (imp.length && gImp>gCalc ? "imp" : "calc");
  if (src==="imp" && !imp.length) src="calc";
  return {src:src, rows: src==="imp"? imp : calc, hasImp: imp.length>0, calcPlayed:gCalc};
}

function processLogo(file,tid){
  if(!file||!/^image\//.test(file.type)){ toast("Scegli un’immagine (PNG, JPG, SVG)"); return; }
  var fr=new FileReader();
  fr.onload=function(){ var img=new Image(); img.onload=function(){
    var c=document.createElement("canvas"); c.width=c.height=160; var x=c.getContext("2d");
    var w=img.naturalWidth||160, hh=img.naturalHeight||160, s=Math.min(144/w,144/hh), dw=w*s, dh=hh*s;
    x.drawImage(img,(160-dw)/2,(160-dh)/2,dw,dh);
    var url=c.toDataURL("image/png"); if(url.length>90000) url=c.toDataURL("image/jpeg",.86);
    setLogo(tid,url);
  }; img.onerror=function(){ toast("Non riesco a leggere questa immagine"); }; img.src=fr.result; };
  fr.readAsDataURL(file);
}
function setLogo(tid,url){
  if(url) LOGOS[tid]=url; else delete LOGOS[tid];
  if(db){ var ref=db.doc("loghi/"+tid); (url?ref.set({src:url}):ref.delete()).catch(function(){ toast("Logo non salvato, riprova"); }); }
  else saveLocalLogos();

function tokenize(text){
  var toks=[], lines=String(text).replace(/\r/g,"").split("\n");
  lines.forEach(function(raw){
    var line=raw.replace(/ /g," ").trim(); if(!line) return;
    var m=line.match(/(\d{1,2})\s*[°ªº^a]?\s*giornata/i)||line.match(/giornata\s*(?:n\.?\s*)?(\d{1,2})\b/i);
    var gm=line.match(/^GIRONE\s+([A-Z]{1,2})\b/i);
    if(gm && line.length<60){ toks.push({t:"GIRONE",v:gm[1].toUpperCase()}); if(m) toks.push({t:"ROUND",v:+m[1]}); return; }
    if(line.length<70 && /CATEGORIA|COPPA|JUNIORES|ALLIEVI|GIOVANISSIMI|ESORDIENTI|PULCINI|FEMMINILE|CALCIO A 5|UNDER\s*\d+/i.test(line) && !/\d\s*[-–]\s*\d/.test(line)){ toks.push({t:"CAT",v:line.toUpperCase()}); return; }
    if(m && line.length<60){ toks.push({t:"ROUND",v:+m[1]}); return; }
    var dm=line.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);
    if(dm){
      var y=+dm[3]; if(y<100) y+=2000;
      toks.push({t:"DATE",v:y+"-"+("0"+dm[2]).slice(-2)+"-"+("0"+dm[1]).slice(-2)});
      line=line.replace(dm[0]," ");
      var tm=line.match(/\b([01]?\d|2[0-3])[:.]([0-5]\d)\b/);
      if(tm){ toks.push({t:"TIME",v:("0"+tm[1]).slice(-2)+":"+tm[2]}); line=line.replace(tm[0]," "); }
      line=line.replace(/\b(lun|mar|mer|gio|ven|sab|dom)[a-zì]*\.?\b/ig," ").replace(/\bore\b/ig," ").replace(/\s+/g," ").trim();
      if(!line || line.length<3) return;
    }
    var r1=line.match(/^(.*?(?:[A-Za-zÀ-ÿ.)']|\s\d{4}))\s+(\d{1,2})\s*[-–:]\s*(\d{1,2})\s+([A-Za-zÀ-ÿ].*)$/);
    if(r1){ toks.push({t:"RESULT",h:r1[1].trim(),a:r1[4].trim(),hg:+r1[2],ag:+r1[3]}); return; }
    var r2=line.match(/^([A-Za-zÀ-ÿ].*?)\s+[-–]\s+([A-Za-zÀ-ÿ].*?)\s+(\d{1,2})\s*[-–:]\s*(\d{1,2})$/);
    if(r2){ toks.push({t:"RESULT",h:r2[1].trim(),a:r2[2].trim(),hg:+r2[3],ag:+r2[4]}); return; }
    var r3=line.match(/^([A-Za-zÀ-ÿ][^\t]*?)\s+[-–]\s+([A-Za-zÀ-ÿ][^\t]*)$/);
    if(r3){ toks.push({t:"PAIR",h:r3[1].trim(),a:r3[2].trim()}); return; }
    line.split(/\t+|\s{3,}/).forEach(function(cell){
      var c=cell.trim(); if(!c) return;
      if(/^[-–]$/.test(c)){ toks.push({t:"DASH"}); return; }
      if(/^\d{1,2}\s*[-–:]\s*\d{1,2}$/.test(c)){ var sp=c.split(/\s*[-–:]\s*/); toks.push({t:"SCORE",hg:+sp[0],ag:+sp[1]}); return; }
      if(/^[-+]?\d+$/.test(c)){ toks.push({t:"NUM",v:+c}); return; }
      if(/^[-+]?\d+(\s+[-+]?\d+)+$/.test(c)){ c.split(/\s+/).forEach(function(n){toks.push({t:"NUM",v:+n});}); return; }
      var lead=c.match(/^(\d{1,2})[.)°]?\s+([A-Za-zÀ-ÿ].*)$/);
      if(lead){ toks.push({t:"NUM",v:+lead[1]}); c=lead[2]; }
      var tr=c.match(/^(.*?[A-Za-zÀ-ÿ.)'](?:\s+\d{4})?)((?:\s+[-+]?\d{1,3})+)$/);
      if(tr){ toks.push({t:"TEXT",v:tr[1].trim()}); tr[2].trim().split(/\s+/).forEach(function(n){toks.push({t:"NUM",v:+n});}); return; }
      toks.push({t:"TEXT",v:c});

  });

}
function solveRow(a){
  for(var j=0;j+3<a.length;j++){
    var g=a[j],v=a[j+1],n=a[j+2],p=a[j+3];
    if(g<0||v<0||n<0||p<0||g>40||v+n+p!==g) continue;
    var target=3*v+n;
    for(var k=0;k<a.length;k++){
      if(k>=j&&k<=j+3) continue;
      if(a[k]===target || (a[k]<target && a[k]>=target-6 && k<j)){
        var rest=a.filter(function(_,i){return i!==k&&(i<j||i>j+3);});
        var gf=rest.length>=2?rest[0]:0, gs=rest.length>=2?rest[1]:0;
        if (k>j+3){ var after=a.slice(j+4).filter(function(_,i){return (j+4+i)!==k;}); if(after.length>=2){gf=after[0];gs=after[1];} }
        else { var aft=a.slice(j+4); if(aft.length>=2){gf=aft[0];gs=aft[1];} }
        return {pts:a[k],g:g,v:v,n:n,p:p,gf:Math.max(0,gf),gs:Math.max(0,gs)};
      }
    }
  }

}
function isTeamText(s){ return s && /[A-Za-zÀ-ÿ]{3}/.test(s) && s.length<=45 && !/^(classifica|risultati|calendario|giornata|squadra|punti|pt|tutte|casa|fuori|andata|ritorno|marcatori|totale|partite|news|home)$/i.test(s.trim()); }
function parsePaste(text, modeSel, roundFallback){

    if(t.t==="TIME"){ ctx.time=t.v; continue; }
    if(t.t==="RESULT"){ res.push({h:t.h,a:t.a,hg:t.hg,ag:t.ag,round:ctx.round,date:ctx.date,time:ctx.time}); continue; }
    if(t.t==="PAIR"){ pairs.push({h:t.h,a:t.a,round:ctx.round,date:ctx.date,time:ctx.time}); continue; }

      if(n1&&n1.t==="SCORE"&&n2&&n2.t==="TEXT"&&isTeamText(n2.v)){ res.push({h:t.v,a:n2.v,hg:n1.hg,ag:n1.ag,round:ctx.round,date:ctx.date,time:ctx.time}); i+=2; continue; }

    var pos=[on.offsetLeft,on.offsetTop,on.offsetWidth,on.offsetHeight], old=SEGPOS[key];

    var prevP=ind.dataset.p, cur=pos.join(",");
